    'crypto-review':'crypto','crypto-receive':'crypto','crypto-receive-address':'crypto',
    'crypto-to-bank':'crypto','crypto-to-bank-account':'crypto','crypto-to-bank-amount':'crypto','crypto-bank-review':'crypto' };
  const isAuthScr = id => AUTH.includes(id);
  function register(map){ Object.assign(SCREENS, map); }
  function onLeave(fn){ if (typeof fn === 'function') cleanups.push(fn); }
  function runCleanups(){ const l = cleanups; cleanups = []; l.forEach(fn=>{ try { fn(); } catch(e){} }); }
  function pathOf(id){ return '#/' + id.split('-').join('/'); }
  function parse(h){
    const p = String(h||'').replace(/^#\/?/,'').split('/').filter(Boolean);
    for (let k = p.length; k > 0; k--){ const id = p.slice(0,k).join('-'); if (SCREENS[id]) return { id, rest:p.slice(k) }; }
    return null;
  }
  function setHash(h){ try { if (location.hash !== h) history.replaceState(history.state, '', h); } catch(e){} }
  function syncHash(id){ const c = parse(location.hash); if (!c || c.id !== id) setHash(pathOf(id)); }
  function sync(id){ syncHash(id); curHash = location.hash; }
  function arm(){ try { if (!(history.state && history.state.yorTop)) history.pushState({ yorTop:true }, '', location.href); } catch(e){} }
  function chrome(id){
    const nav = document.getElementById('bottom-nav');
    const hideNav = isAuthScr(id) || /^settings|^banks-add|^contact-add|^cards-add/.test(id);
    if (nav) nav.hidden = hideNav;
    const m = document.getElementById('main'); if (m) m.classList.toggle('no-nav', hideNav);
    const key = NAV_KEYS[id];
    document.querySelectorAll('.nav-item,.side-item').forEach(a=>{
      const on = !!key && a.getAttribute('data-nav') === key;
      if (a.classList.contains('side-item')) a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
  }
  function go(id, opts){
    opts = opts || {};
    if (isAuthScr(id) && AuthEngine.isAuthed()) id = 'home';
    if (!isAuthScr(id) && !AuthEngine.isAuthed()) id = 'welcome';
    if (current === id && !opts.force){
      if (opts.hash && opts.hash !== curHash) opts = Object.assign({}, opts, { force:true });
      else { sync(id); return; }
    }
    const fn = SCREENS[id];
    if (!fn){ console.warn('[R] no screen for', id); return; }
    if (opts.hash) setHash(opts.hash);
    const my = ++token;
    runCleanups(); closeAll(true);
    let html;
    try { html = fn(); } catch(e){ console.error('[R] render', id, e); return; }
    if (my !== token || !html) return;
    const from = current;
    if (opts.reset || (from && isAuthScr(from) !== isAuthScr(id))) stack.length = 0;
    else if (from && from !== id && !opts.back && !opts.replace){ stack.push(from); if (stack.length > 40) stack.shift(); }
    const container = document.getElementById('screens');
    let el = document.getElementById(id);
    if (!el){ el = document.createElement('section'); el.id = id; el.className = 'screen'; container.appendChild(el); }
    el.innerHTML = html;
    document.querySelectorAll('.screen').forEach(s=>{ if (s !== el) s.classList.remove('active'); });
    el.classList.toggle('from-back', !!opts.back);
    el.classList.add('active');
    el.scrollTop = 0;
    current = id;
    if (id === 'receipt'){ stack.length = 0; stack.push('home'); }
    sync(id);
    if (stack.length) arm();
    chrome(id);
    wire(id);
    if (typeof UIKit !== 'undefined') UIKit.enhanceSync(el);
  }
  function back(){
    if (overlays.length){ closeTop(); return; }
    if (LOCKED.includes(current)) return;
    if (stack.length){ go(stack.pop(), { back:true }); return; }
    if (isAuthScr(current)){ if (current !== 'welcome') go('welcome', { back:true }); return; }
    if (PARENT[current]){ go(PARENT[current], { back:true }); return; }
    if (current !== 'home') go('home', { back:true });
  }
  function home(){ stack.length = 0; go('home', { reset:true }); }
  function open(html, o){
    o = o || {};
    let root = document.getElementById('ov-root');
    if (!root){ root = document.createElement('div'); root.id = 'ov-root'; root.className = 'ov-root'; document.body.appendChild(root); }
    const wrap = document.createElement('div');
    wrap.className = 'ov' + (o.kind === 'modal' ? ' is-modal' : '');
    wrap.innerHTML = '<div class="ov-backdrop"></div><div class="ov-panel" role="dialog" aria-modal="true" tabindex="-1"' + (o.label ? ' aria-label="' + escapeHtml(o.label) + '"' : '') + '>' + html + '</div>';
    const rec = { wrap, panel: wrap.querySelector('.ov-panel'), prev: document.activeElement, onClose: o.onClose, dismissible: o.dismissible !== false, closed:false };
    root.appendChild(wrap); overlays.push(rec);
    wrap.querySelector('.ov-backdrop').addEventListener('click', ()=>{ if (rec.dismissible) closeRec(rec); });
    requestAnimationFrame(()=>{ wrap.classList.add('is-open'); try { rec.panel.focus({ preventScroll:true }); } catch(e){} });
    arm();
    return ()=>closeRec(rec);
  }
  function closeRec(rec, instant){
    if (rec.closed) return; rec.closed = true;
    const i = overlays.indexOf(rec); if (i >= 0) overlays.splice(i, 1);
    rec.wrap.classList.remove('is-open');
    const done = ()=>{ if (rec.wrap.parentNode) rec.wrap.parentNode.removeChild(rec.wrap); };
    if (instant) done(); else setTimeout(done, 340);
    try { if (rec.prev && rec.prev.focus && document.contains(rec.prev)) rec.prev.focus({ preventScroll:true }); } catch(e){}
    if (typeof rec.onClose === 'function'){ try { rec.onClose(); } catch(e){} }
  }
  function closeTop(){ const r = overlays[overlays.length - 1]; if (r && r.dismissible) closeRec(r); }
  function closeAll(instant){ overlays.slice().forEach(r=>closeRec(r, instant)); }
  function bind(){
    if (bound) return; bound = true;
    try { history.replaceState({ yorBase:true }, '', location.href); history.pushState({ yorTop:true }, '', location.href); } catch(e){}
    window.addEventListener('popstate', e=>{
      if (!started || !(e.state && e.state.yorBase)) return;
      if (current) setHash(curHash);
      if (overlays.length){ arm(); closeTop(); return; }
      if (LOCKED.includes(current)){ arm(); return; }
      if (stack.length || (current && current !== 'home' && current !== 'welcome')){ arm(); back(); }
    });
    window.addEventListener('hashchange', ()=>{
      if (!started) return;
      const st = history.state;
      if (!st || (!st.yorBase && !st.yorTop)){ try { history.replaceState({ yorBase:true }, '', location.href); } catch(e){} }
      const r = parse(location.hash);
      if (!r){ if (current) setHash(curHash); return; }
      if (r.id === current){ if (location.hash !== curHash){ curHash = location.hash; go(r.id, { force:true }); } return; }
      go(r.id, { fromHash:true });
    });
    document.addEventListener('keydown', e=>{
      if (!overlays.length) return;
      if (e.key === 'Escape'){ e.preventDefault(); closeTop(); return; }
      if (e.key !== 'Tab') return;
      const p = overlays[overlays.length - 1].panel;
      const f = p.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])');
      if (!f.length){ e.preventDefault(); p.focus(); return; }
      const first = f[0], last = f[f.length - 1], ae = document.activeElement;
      if (e.shiftKey && (ae === first || ae === p)){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && ae === last){ e.preventDefault(); first.focus(); }
    });
  }
  function start(authed){
    if (started) return; started = true;
    const want = parse(location.hash);
    stack.length = 0;
    if (authed && want && !isAuthScr(want.id) && !NO_RESTORE.includes(want.id)){ if (want.id !== 'home') stack.push('home'); go(want.id); }
    else go(authed ? 'home' : 'welcome');
  }
  return { go, back, home, start, bind, current:()=>current, register, onLeave,
           overlay:{ open, close:closeTop, isOpen:()=>overlays.length > 0 },
           debug:()=>({ current, stack:stack.slice(), overlays:overlays.length }) };
})();

const FLOW_DRAFT_MAX_AGE_MS = 30 * 60 * 1000;
const _TX0 = JSON.stringify(TX_STATE), _CF0 = JSON.stringify(CRYPTO_FLOW);
function persistFlowDrafts(){
  try {
    const tx = JSON.stringify(TX_STATE), cf = JSON.stringify(CRYPTO_FLOW);
    if (tx !== _TX0) PersistenceEngine.saveDraft('tx', JSON.parse(tx)); else PersistenceEngine.clearDraft('tx');
    if (cf !== _CF0) PersistenceEngine.saveDraft('crypto', JSON.parse(cf)); else PersistenceEngine.clearDraft('crypto');
  } catch(e){}
}
function restoreFlowDrafts(){
  try {
    const m = PersistenceEngine.get(), d = m.drafts;
    if (!d || !d.savedAt || Date.now() - d.savedAt > FLOW_DRAFT_MAX_AGE_MS){ if (d && (d.tx || d.crypto)){ d.tx = null; d.crypto = null; PersistenceEngine.save(); } return; }
    if (d.tx){
      Object.assign(TX_STATE, d.tx);
      if (TX_STATE.country && TX_STATE.country.iso){ const c = CountryTransferEngine.getConfig(TX_STATE.country.iso); if (c) TX_STATE.country = c; }

}

const ProcessingEngine = (() => {
  let state = null;
  let _globalLock = false; /* BUG-03 FIX: persists across re-renders */
  function acquireLock(){ if (_globalLock) return false; _globalLock = true; return true; }
  function releaseLock(){ _globalLock = false; }
  function isLocked(){ return _globalLock; }
  function start(onDone, opts){
    opts = opts || {};
    const duration = opts.duration || CONFIG.PROCESSING.durationMs;
    state = { active:true, startTime: Date.now(), duration };
    const numEl = document.getElementById('proc-num');
    const ringEl = document.getElementById('ring-fg');
    const C = 2 * Math.PI * 80;
    const FRAME = 100;
    let lastRun = 0;
    function tick(){
      if (!state.active) return;
      const now = Date.now();
      const elapsed = now - state.startTime;
      const progress = Math.min(elapsed / duration, 1);
      if (now - lastRun < FRAME - 5 && progress < 1){ requestAnimationFrame(tick); return; }
      lastRun = now;
      const remaining = Math.max(0, Math.ceil((duration - elapsed) / 1000));
      if (numEl) numEl.textContent = String(remaining);
      if (ringEl) ringEl.style.strokeDashoffset = String(C * (1 - progress));
      if (progress >= 1){ state.active = false; setTimeout(()=>{ releaseLock(); onDone && onDone(); }, 250); return; }
      requestAnimationFrame(tick);
    }
    tick();
  }
  function cancel(){ if (state){ state.active = false; } releaseLock(); }
  return { start, cancel, acquireLock, releaseLock, isLocked };
})();

function commitCryptoTransaction(kind){
  const now = Date.now();
  const data = (CRYPTO_FLOW.pending && CRYPTO_FLOW.pending.data) || {};
  const asset = data.asset || {};
  const symbol = asset.symbol || data.symbol || 'CRYPTO';
  const tx = {
    id: ID.transaction(), reference: ID.reference(), type: kind, direction: 'OUT', status: 'SUCCESS',
    sourceWalletId: data.walletId || null,
    asset: symbol, sourceAsset: symbol, destinationAsset: data.toAsset ? (CRYPTO_ASSETS.find(a=>a.id === data.toAsset)||{}).symbol : null,
    amount: data.amount || 0, destinationAmount: data.destinationAmount || null,
    network: data.network || null, networkId: data.networkId || null,
    fromAddress: data.fromAddress || null, toAddress: data.toAddress || null,
    bankId: data.bankId || null, bankName: data.bankName || null,
    fee: data.fee || 0, networkFee: data.networkFee || 0, total: data.total || data.amount || 0,
    beneficiary: data.beneficiary || null,
    createdAt: now, completedAt: now,
    blockchainTxHash: kind.startsWith('CRYPTO') ? '0x' + Array.from({length:64}, ()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join('') : null,
    txnTypeLabel: kind
  };
  TransactionEngine.add(tx);
  LedgerEngine.record(tx);
  PersistenceEngine.log('crypto.commit', { id: tx.id, reference: tx.reference, kind: kind });
  if ((kind === 'CRYPTO_SEND' || kind === 'CRYPTO_TO_BANK') && data.assetId && data.networkId){
    CryptoWalletEngine.debit(data.assetId, data.networkId, data.amount);
  }
  return tx;
}

const _sparkCache = new Map();
function sparklineSvg(symbol, w, h){
  w = w || 72; h = h || 32;
  const _sparkKey = symbol + '|' + w + '|' + h;
  const cached = _sparkCache.get(_sparkKey);
  if (cached) return cached;
  const seed = String(symbol || 'X').split('').reduce((a,c)=>a + c.charCodeAt(0), 7);
  let s = seed >>> 0;
  function rnd(){ s = (s * 1103515245 + 12345) >>> 0; return s / 4294967296; }
  const n = 20, pts = [];
  let v = 0.5;
  for (let i = 0; i < n; i++){ v += (rnd() - 0.5) * 0.22; v = Math.max(0.08, Math.min(0.92, v)); pts.push(v); }
  const stepX = w / (n - 1);
  const path = pts.map((p,i)=> (i===0?'M':'L') + (i*stepX).toFixed(2) + ' ' + ((1-p)*h).toFixed(2)).join(' ');
  const up = pts[pts.length-1] >= pts[0];
  const color = up ? '#10B981' : '#EF4444';
  const _sparkOut = '<svg viewBox="0 0 '+w+' '+h+'" fill="none" preserveAspectRatio="none"><path d="'+path+'" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  _sparkCache.set(_sparkKey, _sparkOut);
  return _sparkOut;
}

function downloadBlob(filename, content, mime){
  try {
    const blob = new Blob([content], { type: mime || 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 3000);
    return true;
  } catch(e){
    try {
      const blob = new Blob([content], { type: mime || 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const w = window.open(url, '_blank');
      if (!w) return false;
      setTimeout(()=>URL.revokeObjectURL(url), 30000);
      return true;
    } catch(err){ return false; }
  }
}

function luhnGenerateCardNumber(prefix, length){
  length = length || 16;
  let base = String(prefix || '4532');
  while (base.length < length - 1) base += String(Math.floor(Math.random() * 10));
  let sum = 0, alt = true;
  for (let i = base.length - 1; i >= 0; i--){
    let n = parseInt(base.charAt(i), 10);
    if (alt){ n *= 2; if (n > 9) n -= 9; }
    sum += n;
    alt = !alt;
  }
  const check = (10 - (sum % 10)) % 10;
  return base + String(check);
}

function qrSvgFor(text){
  const seed = String(text || '');
  const size = 29;
  let s = 0; for (let i=0;i<seed.length;i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
  function rnd(){ s = (s * 1103515245 + 12345) >>> 0; return s / 4294967296; }
  const cells = [];
  function finder(ox, oy){ for (let y=0;y<7;y++) for (let x=0;x<7;x++){ const on = (x===0||x===6||y===0||y===6) || (x>=2&&x<=4&&y>=2&&y<=4); if (on) cells.push([ox+x, oy+y]); } }
  finder(0,0); finder(size-7,0); finder(0,size-7);
  for (let y=0;y<size;y++) for (let x=0;x<size;x++){ if ((x<8&&y<8)||(x>=size-8&&y<8)||(x<8&&y>=size-8)) continue; if (rnd() > 0.55) cells.push([x,y]); }
  const rects = cells.map(([x,y]) => '<rect x="'+x+'" y="'+y+'" width="1" height="1"/>').join('');
  return '<svg viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="'+size+'" height="'+size+'" fill="#fff"/><g fill="#0A0A14">'+rects+'</g></svg>';
}

function renderReceipt(){
  const s = PersistenceEngine.get();
  const snapshot = s.receipts[s.receipts.length - 1];
  if (!snapshot){ R.go('home'); return ''; }
  const tx = snapshot.transactionId ? s.transactions.find(x => x.id === snapshot.transactionId) : null;
  const r = tx
    ? Object.assign({}, snapshot, {
        reference:       tx.reference       || snapshot.reference,
        status:          tx.status          || snapshot.status,
        createdAt:       tx.createdAt       || snapshot.createdAt,
        amount:          tx.amount   != null ? tx.amount   : snapshot.amount,
        currency:        tx.currency        || snapshot.currency,
        fee:             tx.fee      != null ? tx.fee      : snapshot.fee,
        vat:             tx.vat      != null ? tx.vat      : snapshot.vat,
        total:           tx.total    != null ? tx.total    : snapshot.total,
        asset:           tx.asset           || snapshot.asset,
        network:         tx.network         || snapshot.network,
        destinationAmount:   tx.destinationAmount   != null ? tx.destinationAmount   : snapshot.destinationAmount,
        destinationCurrency: tx.destinationCurrency || snapshot.destinationCurrency,
        exchangeRate:    tx.exchangeRate    || snapshot.exchangeRate,
        beneficiary:     tx.beneficiary     || snapshot.beneficiary
      })
    : snapshot;

  const isCrypto = !!r.asset;
  const country = r.beneficiary && r.beneficiary.country ? COUNTRY_DATA[r.beneficiary.country] : null;
  const cName = country ? (country[LANG] || country.fr)
              : (r.beneficiary && r.beneficiary.networkName) ? r.beneficiary.networkName
              : (r.network || '—');
  const masked = ContactsEngine.mask(r.beneficiary && r.beneficiary.name);
  const amtFmt   = isCrypto ? CurrencyEngine.formatCrypto(r.amount, r.asset)       : CurrencyEngine.format(r.amount, r.currency);
  const feeFmt   = isCrypto ? CurrencyEngine.formatCrypto(r.fee || 0, r.asset)     : CurrencyEngine.format(r.fee || 0, r.currency);
  const vatFmt   = r.vat ? CurrencyEngine.format(r.vat, r.currency || 'OMR') : null;
  const totalFmt = isCrypto ? CurrencyEngine.formatCrypto(r.total, r.asset)        : CurrencyEngine.format(r.total, r.currency);
  const destFmt  = r.destinationAmount != null
    ? CurrencyEngine.format(r.destinationAmount, r.destinationCurrency || (country ? country.cur : 'OMR'))
    : null;

  window.__YOR_LAST_RECEIPT__ = r;

  return '<div class="receipt-view">'+
    '<div class="receipt-head">'+logoLockup(36)+
      '<button class="topbar-action" data-action="share-receipt" aria-label="'+t('ui.share')+'">'+icon('share',18)+'</button>'+
    '</div>'+
    '<div class="receipt-hero">'+
      '<div class="success-ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>'+
      '<div class="receipt-title">'+t('success.title')+'</div>'+
      '<div class="receipt-sub">'+t('success.subtitle')+'</div>'+
    '</div>'+
    '<div class="glass-elevated receipt-panel">'+
      '<div class="receipt-benef">'+
        '<div class="receipt-avatar">'+icon(isCrypto ? 'crypto' : 'user',24)+'</div>'+
        '<div class="receipt-benef-body">'+
          '<div class="receipt-benef-label">'+t('receipt.beneficiary')+'</div>'+
          (r.beneficiary && r.beneficiary.phone ? '<div class="receipt-benef-phone ltr" style="margin-top:8px;font-size:15px;font-weight:700;color:var(--text)">'+escapeHtml(r.beneficiary.phone)+'</div>' : '')+
          (r.beneficiary && r.beneficiary.yorId ? '<div class="receipt-benef-phone ltr" style="margin-top:6px;font-size:13px;color:var(--accent);font-weight:700">'+escapeHtml(r.beneficiary.yorId)+'</div>' : '')+
          '<div class="recog-mask">'+escapeHtml(masked)+'</div>'+
          '<div class="recog-realname">'+escapeHtml((r.beneficiary && r.beneficiary.name) || '—')+'</div>'+
          (country
            ? '<div class="receipt-benef-country" style="margin-top:10px"><span class="receipt-flag">'+flag(country.iso)+'</span><span>'+escapeHtml(cName)+'</span></div>'
            : ((isCrypto || r.network) ? '<div class="receipt-benef-country" style="margin-top:10px"><span>'+escapeHtml(cName)+'</span></div>' : ''))+
        '</div>'+
        '<span class="receipt-saved">'+icon('check',12)+' <span>'+t('receipt.saved')+'</span></span>'+
      '</div>'+
      (r.network ? '<div class="receipt-service"><div class="receipt-service-icon">'+icon('globe',22)+'</div><div class="receipt-service-body"><div class="receipt-benef-label">'+t('receipt.service')+'</div><div class="receipt-service-name">'+escapeHtml(r.network)+'</div></div></div>' : '')+
    '</div>'+
    '<div class="glass-elevated receipt-panel">'+
      '<div class="receipt-row"><div class="receipt-row-icon">'+icon('send',17)+'</div><span class="receipt-row-label">'+t('receipt.amountSent')+'</span><span class="receipt-row-value">'+escapeHtml(amtFmt)+'</span></div>'+
      (destFmt ? '<div class="receipt-row"><div class="receipt-row-icon">'+icon('receive',17)+'</div><span class="receipt-row-label">'+t('transfer.receiving')+'</span><span class="receipt-row-value" style="color:var(--accent)">'+escapeHtml(destFmt)+'</span></div>' : '')+

  const rows = [];
  if (p.kind === 'BUY'){ rows.push([t('crypto.fiatSpend'), CurrencyEngine.format(d.fiatAmount,'OMR')]); rows.push([t('crypto.youGet'), CurrencyEngine.formatCrypto(d.amount,(d.asset||{}).symbol||'')]); }
  if (p.kind === 'SELL'){ rows.push([t('crypto.youPay'), CurrencyEngine.formatCrypto(d.amount,(d.asset||{}).symbol||'')]); rows.push([t('crypto.fiatReceive'), CurrencyEngine.format(d.fiatReceived||0,'OMR')]); }

  if (p.kind === 'SEND'){ rows.push([t('crypto.amount'), CurrencyEngine.formatCrypto(d.amount,(d.asset||{}).symbol||'')]); rows.push([t('crypto.address'), AddressEngine.short(d.toAddress||'')]); if (d.memo) rows.push([t('crypto.memo'), d.memo]); }
  rows.push([t('crypto.fee'), CurrencyEngine.formatCrypto(d.fee||0,(d.asset||{}).symbol||'')]); if (d.networkFee) rows.push([t('crypto.networkFee'), CurrencyEngine.formatCrypto(d.networkFee,(d.asset||{}).symbol||'')]);

/* ============ UIKIT ============ */
const UIKit = (() => {
  const LABELS = {
    back:'ui.back',
    notifications:'ui.notifications',
    'mark-notifs':'ui.markRead',
    'toggle-balance':'ui.toggleBalance',
    share:'ui.share',
    'share-receipt':'ui.share',
    download:'action.download',
    'download-receipt':'action.download',
    'contact-remove':'ui.remove',
    'crypto-market':'ui.market',
    'banks-add':'ui.addBank',
    'card-toggle-number':'cards.showNumber',
    'card-toggle-cvv':'cards.showCvv',
    'settings-toggle-notifs':'settings.notifs',
    'settings-toggle-biometric':'settings.biometric',
    'settings-toggle-txconfirm':'settings.txConfirm',
    'settings-toggle-vibration':'settings.vibration',
    'copy':'action.copy'
  };
  const NATIVE = { BUTTON:1, A:1, INPUT:1, SELECT:1, TEXTAREA:1, SUMMARY:1 };
  const GUARD_MS = 450;
  let started = false, raf = 0, timer = 0;

  function haptic(kind){
    try {
      const st = PersistenceEngine.get();
      if (st && st.settings && st.settings.vibration === false) return;
      if (!navigator.vibrate) return;
      navigator.vibrate(kind === 'success' ? [12,40,12] : kind === 'error' ? [40,30,40] : 8);
    } catch(e){}
  }
  function loading(btn, on){
    if (!btn) return;
    btn.classList.toggle('is-loading', !!on);
    if (on){ btn.setAttribute('aria-busy','true'); btn.disabled = true; }
    else { btn.removeAttribute('aria-busy'); btn.disabled = false; }
  }
  function labelFor(el){
    const k = el.getAttribute('data-action') || el.getAttribute('data-nav') || '';
    if (LABELS[k]) return t(LABELS[k]);
    if (el.classList.contains('topbar-back')) return t('ui.back');
    return '';
  }
  function enhance(root){
    if (!root || !root.querySelectorAll) return;
    root.querySelectorAll('button,[role="button"],a[data-nav]').forEach(el=>{
      if (el.hasAttribute('aria-label') || el.hasAttribute('aria-labelledby')) return;
      if ((el.textContent || '').trim()) return;
      const l = labelFor(el); if (l) el.setAttribute('aria-label', l);
    });
    root.querySelectorAll('[data-action="toggle-balance"]').forEach(el=>{ el.setAttribute('aria-pressed', PersistenceEngine.get().hideBalance ? 'true' : 'false'); });
    root.querySelectorAll('.item,.select-item,.country-row,.service-pill,.contact-card,[data-action],[data-nav]').forEach(el=>{
      if (NATIVE[el.tagName]) return;
      if (el.onclick){
        if (!el.hasAttribute('role')) el.setAttribute('role', 'button');
        if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
      } else if (el.classList.contains('item') || el.classList.contains('select-item')){
        el.classList.add('is-static');
      }
    });
    root.querySelectorAll('button.select-item').forEach(el=>{ el.setAttribute('aria-pressed', el.classList.contains('selected') ? 'true' : 'false'); });
    root.querySelectorAll('.field').forEach(f=>{
      const lab = f.querySelector('label.field-label'), inp = f.querySelector('input,select,textarea');
      if (!lab || !inp) return;
      if (!inp.id) inp.id = 'f-' + Math.random().toString(36).slice(2, 8);
      if (!lab.getAttribute('for')) lab.setAttribute('for', inp.id);
    });
    root.querySelectorAll('.field-err').forEach(e=>{ if (!e.hasAttribute('role')) e.setAttribute('role','alert'); });
    root.querySelectorAll('input.ltr:not([lang])').forEach(inp=> inp.setAttribute('lang','en'));
    const scr = root.classList && root.classList.contains('screen') ? root : (root.closest ? root.closest('.screen') : null);
    if (scr && !/^(login|register)$/.test(scr.id)){
      const err = scr.querySelector('.field-err[id]');
      const inputs = Array.prototype.slice.call(scr.querySelectorAll('.field input:not([type="hidden"])'));
      const hasErr = !!(err && err.textContent.trim());
      inputs.forEach(i=>{
        if (err && !i.hasAttribute('aria-describedby')) i.setAttribute('aria-describedby', err.id);
        if (!i.getAttribute('enterkeyhint')) i.setAttribute('enterkeyhint', 'done');
        const box = i.closest('.field-box');
        const bad = hasErr && inputs.length === 1;
        if (bad) i.setAttribute('aria-invalid','true'); else i.removeAttribute('aria-invalid');
        if (box) box.classList.toggle('is-invalid', bad);
      });
    }
  }
  let _lastEnhance = 0;
  function enhanceAll(){
    raf = 0; timer = 0; _lastEnhance = Date.now();
    enhance(document.querySelector('.screen.active'));
    enhance(document.getElementById('bottom-nav'));
    enhance(document.getElementById('side-nav'));
    const tc = document.getElementById('toasts'); if (tc && !tc.getAttribute('role')) tc.setAttribute('role','status');
  }
  function schedule(){
    if (raf || timer) return;
    const since = Date.now() - _lastEnhance;
    const delay = since >= 30 ? 0 : (30 - since);
    if (delay === 0){ raf = requestAnimationFrame(enhanceAll); }
    else { timer = setTimeout(enhanceAll, delay); }
  }
  function enhanceSync(root){
    enhance(root);
    _lastEnhance = Date.now();
  }
  function init(){
    if (started) return; started = true;
    document.addEventListener('click', e=>{
      const b = e.target && e.target.closest ? e.target.closest('.btn') : null;
      if (!b || b.disabled) return;
      const now = Date.now();
      if (b.__until && b.__until > now){ e.stopImmediatePropagation(); e.preventDefault(); return; }
      b.__until = now + GUARD_MS;
      haptic('tap');
    }, true);
    document.addEventListener('keydown', e=>{
      const el = e.target;
      if (!el || !el.getAttribute) return;
      if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute('role') === 'button' && !NATIVE[el.tagName]){
        e.preventDefault(); el.click(); return;
      }
      if (e.key === 'Enter' && el.tagName === 'INPUT' && !el.isComposing){
        const scr = el.closest('.screen.active'); if (!scr || /^(login|register)$/.test(scr.id)) return;
        const prim = scr.querySelectorAll('.btn-primary[id]');
        if (prim.length === 1 && !prim[0].disabled){ e.preventDefault(); prim[0].click(); }
      }
    });
    const host = document.getElementById('app');
    if (host && window.MutationObserver) new MutationObserver(schedule).observe(host, { childList:true, subtree:true });
    schedule();
  }
  return { init, enhance, enhanceSync, enhanceAll, schedule, haptic, loading, guardMs: GUARD_MS };
})();

const UIKit7 = (() => {
  let kbMode = false;
  function onPointer(){ if (kbMode){ kbMode = false; document.body.classList.remove('using-keyboard'); } }
  function onKey(e){ if (e.key === 'Tab' && !kbMode){ kbMode = true; document.body.classList.add('using-keyboard'); } }
  function trapFocus(panel){
    if (!panel) return ()=>{};
    const sel = 'button,a,input,select,textarea,[tabindex]:not([tabindex="-1"]),[role="button"]';
    function getFocusable(){ return Array.prototype.slice.call(panel.querySelectorAll(sel)).filter(el => !el.disabled && el.offsetParent !== null); }
    function handler(e){
      if (e.key !== 'Tab') return;
      const els = getFocusable(); if (!els.length) return;
      const first = els[0], last = els[els.length - 1];
      if (e.shiftKey){ if (document.activeElement === first){ e.preventDefault(); last.focus(); } }
      else { if (document.activeElement === last){ e.preventDefault(); first.focus(); } }
    }
    panel.addEventListener('keydown', handler);
    setTimeout(()=>{ const els = getFocusable(); if (els.length) els[0].focus(); }, 80);
    return ()=>{ panel.removeEventListener('keydown', handler); };
  }
  function init(){
    document.addEventListener('keydown', onKey);
    document.addEventListener('mousedown', onPointer);
    document.addEventListener('touchstart', onPointer, { passive:true });
    const observer = new MutationObserver(muts=>{
      muts.forEach(m=>{
        if (m.type === 'attributes' && m.attributeName === 'class'){
          const el = m.target;
          if (el.classList.contains('ov') && el.classList.contains('is-open')){
            const panel = el.querySelector('.ov-panel');
            if (panel && !panel.__trapRelease){
              panel.setAttribute('tabindex', '-1');
              panel.__trapRelease = trapFocus(panel);
            }
          }
          if (el.classList.contains('ov') && !el.classList.contains('is-open')){
            const panel = el.querySelector('.ov-panel');
            if (panel && panel.__trapRelease){ panel.__trapRelease(); panel.__trapRelease = null; }
          }
        }
      });
    });
    document.querySelectorAll('.ov').forEach(ov=>observer.observe(ov, { attributes:true }));
  }
  return { init, trapFocus };
})();

function wire(id){
  if (id === 'login' || id === 'register') wireAuth(id);

  const _wireRoot = document.getElementById(id) || document;

  _wireRoot.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = async (e) => {
      const a = el.getAttribute('data-action');
      if (a === 'back') R.back();
      else if (a === 'go-login') R.go('login', { replace:true });
      else if (a === 'go-register') R.go('register', { replace:true });
      else if (a === 'noop') toast('—');
      else if (a === 'notifications') R.go('notifications');

/* ============ HELPERS ============ */
function commitFiatTransaction(){
  /* BUG-01 FIX: debit directly on the canonical root record, not the volatile view */
  const root = PersistenceEngine.getRoot();
  const yorId = root.auth && root.auth.current;
  const userRec = yorId ? root.users[yorId] : null;
  if (!userRec) throw new Error('SENDER_NOT_FOUND');
  const acc = userRec.accounts.find(a=>a.type === 'MAIN');
  if (!acc) throw new Error('SENDER_ACCOUNT_MISSING');
  const bd = TX_STATE.breakdown;
  if (acc.availableBalance + 1e-9 < bd.total) throw new Error('INSUFFICIENT_BALANCE');
  const now = Date.now();
  const txId = ID.transaction();
  /* atomic debit */
  acc.balance           = Math.round((acc.balance           - bd.total) * 1000) / 1000;
  acc.availableBalance  = Math.round((acc.availableBalance  - bd.total) * 1000) / 1000;
  acc.updatedAt = now;
  const countryCur = (TX_STATE.country && (TX_STATE.country.cur || TX_STATE.country.currency)) || 'OMR';
  const countryIso = TX_STATE.country && TX_STATE.country.iso;
  const beneficiaryObj = {
    id: TX_STATE.beneficiary.id || null,
    name: TX_STATE.beneficiary.name || TX_STATE.beneficiary.phone,
    phone: TX_STATE.beneficiary.phone,
    country: countryIso,
    network: TX_STATE.provider ? TX_STATE.provider.name : null,
    networkName: TX_STATE.provider ? TX_STATE.provider.name : null
  };
  const tx = {
    id: txId, reference: ID.reference(), type:'TRANSFER', direction:'OUT', status:'SUCCESS',
    amount: bd.amount, currency:'OMR', fee: bd.fee, vat: bd.vat, total: bd.total,
    sourceAccountId: acc.id,
    destinationCurrency: countryCur,
    destinationAmount: TX_STATE.fx ? TX_STATE.fx.amount : null,
    exchangeRate: TX_STATE.fx ? TX_STATE.fx.rate : null,
    beneficiary: beneficiaryObj,
    createdAt: now, completedAt: now, txnTypeLabel:'TRANSFER'
  };
  /* BUG-02 FIX: use `beneficiary` consistently (drop old `recipient` key) */
  const receipt = {
    id: ID.receipt(), transactionId: txId, status:'SUCCESS',
    amount: bd.amount, currency:'OMR', fee: bd.fee, vat: bd.vat, total: bd.total,
    destinationAmount: TX_STATE.fx ? TX_STATE.fx.amount : null,
    destinationCurrency: countryCur,
    beneficiary: beneficiaryObj,
    network: TX_STATE.provider ? TX_STATE.provider.name : null,
    country: countryIso, reference: tx.reference, createdAt: now
  };
  userRec.transactions.unshift(tx);
  if (userRec.transactions.length > 500) userRec.transactions.length = 500;
  userRec.updatedAt = now;
  PersistenceEngine.invalidateView();
  PersistenceEngine.save();
  LedgerEngine.record(tx);
  PersistenceEngine.log('transfer.commit', { id: tx.id, reference: tx.reference, total: tx.total });
  return { tx, receipt };
}
function renderCountdownVisual(endsAt, totalMs){
  const numEl = document.getElementById('proc-num');
  const ringEl = document.getElementById('ring-fg');
  if (!numEl || !ringEl) return;
  const C = 2 * Math.PI * 80;
  const FRAME = 100;
  let lastRun = 0, raf = 0;
  function tick(){
    raf = 0;
    const now = Date.now();
    const progress = Math.min(1, (now - (endsAt - totalMs)) / totalMs);
    if (now - lastRun < FRAME - 5 && progress < 1){ raf = requestAnimationFrame(tick); return; }
    lastRun = now;
    const remain = Math.max(0, Math.ceil((endsAt - now) / 1000));
    numEl.textContent = String(remain);
    ringEl.style.strokeDashoffset = String(C * (1 - progress));
    if (remain > 0) raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
  R.onLeave(()=>{ if (raf) cancelAnimationFrame(raf); });
}

/* ============ FULLSCREEN ============ */
function requestFullscreen(){
  try {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (fn && !document.fullscreenElement && !document.webkitFullscreenElement){ fn.call(el).catch(()=>{}); }
  } catch(e){}
}

/* ============ VIEWPORT ENGINE ============ */
const ViewportEngine = (() => {
  const root = document.documentElement;
  const vv = window.visualViewport || null;
  let kbOpen = false;
  function setVH(){
    const h = vv ? vv.height : window.innerHeight;
    root.style.setProperty('--vh', (h * 0.01) + 'px');
  }
  function setOrientation(){
    root.classList.toggle('is-landscape', window.matchMedia('(orientation: landscape)').matches);
  }
  function onViewportChange(){
    setVH();
    setOrientation();
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.style.setProperty('--kb', kb + 'px');
    const open = kb > 80;
    if (open !== kbOpen){ kbOpen = open; document.body.classList.toggle('kb-open', kbOpen); }
  }
  function onFocusIn(e){
    const el = e.target;
    if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    setTimeout(() => { try { el.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(err){} }, 120);
  }
  function init(){
    setVH(); setOrientation();
    window.addEventListener('resize', onViewportChange, { passive:true });
    window.addEventListener('orientationchange', onViewportChange);
    if (vv){ vv.addEventListener('resize', onViewportChange); vv.addEventListener('scroll', onViewportChange); }
    document.addEventListener('focusin', onFocusIn);
  }
  return { init };
})();

/* ============ BOOT ============ */
function boot(){
  if (boot._done) return; boot._done = true;
  ViewportEngine.init();
  let s = PersistenceEngine.get();
  AuthEngine.restore();
  s = PersistenceEngine.get();
  if (s.authed) restoreFlowDrafts();
  else { PersistenceEngine.clearDraft('tx'); PersistenceEngine.clearDraft('crypto'); }
  LANG = s.lang || 'fr';
  applyI18n();
  applyTheme(s.theme || 'dark');
  renderSidebar();

  (function bindBottomNavOnce(){
    const nav = document.getElementById('bottom-nav');
    if (!nav || nav.__bound) return;
    nav.__bound = true;
    nav.querySelectorAll('[data-nav]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.preventDefault();
        const n = el.getAttribute('data-nav');
        if (n === 'home') R.go('home');
        else if (n === 'history') R.go('history');
        else if (n === 'cards') R.go('cards');
        else if (n === 'profile') R.go('profile');
        else if (n === 'crypto') R.go('crypto');
        else if (n === 'banks') R.go('banks');
        else if (n === 'settings') R.go('settings');
      });
    });
  })();

  const splashLogo = document.getElementById('splash-logo');
  if (splashLogo) splashLogo.innerHTML = logoLockup(72);
  setTimeout(()=>{
    const sp = document.getElementById('splash');
    sp.classList.add('is-hidden');
    setTimeout(()=>{ sp.style.display = 'none'; }, 600);
    R.start(!!s.authed);
  }, 1500);
  R.bind();
  UIKit.init();
  UIKit7.init();
  document.addEventListener('visibilitychange', ()=>{ if (document.hidden){ persistFlowDrafts(); PersistenceEngine.flush(); } else { TransactionScheduler.scan(); if (PersistenceEngine.status().dirty) PersistenceEngine.flush(); } });
  window.addEventListener('pagehide', ()=>{ persistFlowDrafts(); PersistenceEngine.flush(); });
  window.addEventListener('storage', (e)=>{
    const onAuthScreen = () => ['welcome','login','register'].includes(R.current());
    const kickOut = () => { txReset(); resetCryptoFlow(); resetCardState(); R.go('welcome'); };
    if (e.key === PersistenceEngine.KEY && e.newValue){
      PersistenceEngine.syncExternal(e.newValue);
      if (!AuthEngine.isAuthed() && !onAuthScreen()) kickOut();
    }
    if (e.key === PersistenceEngine.SESSION_KEY && !e.newValue){
      if (AuthEngine.isAuthed()) AuthEngine.restore();
      if (!AuthEngine.isAuthed() && !onAuthScreen()) kickOut();
    }
  });
  TransactionScheduler.start();
  document.addEventListener('click', function once(){ requestFullscreen(); document.removeEventListener('click', once); }, { once: true });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* ============ INTERNAL TESTS — __YOR_TEST__() dans la console ============ */
window.__YOR_TEST__ = function(){
  const results = [];
  const log = (name, pass, detail) => { results.push({name, pass, detail: detail||''}); console.log((pass?'✅':'❌')+' '+name+(detail?('  · '+detail):'')); };
  const snapshot = JSON.stringify(PersistenceEngine.getRoot());
  try {
    const root = PersistenceEngine.getRoot();
    const owner = root.users[PersistenceEngine.OWNER_YOR_ID];
    if (!owner){ log('Owner exists', false, 'Owner not found'); return results; }
    const ownerAcc = owner.accounts.find(a => a.type === 'MAIN' && a.currency === 'OMR');
    const ownerInitial = ownerAcc.balance;
    log('TEST 0 — Owner has initial balance', Math.abs(ownerInitial - 12450.800) < 1e-6, 'Owner OMR = ' + ownerInitial);
    log('TEST 0 — Owner is role=owner', owner.role === 'owner', '');

    const userBId = PersistenceEngine.createUser({ username: 'test_b_' + Date.now(), profile: { firstName:'User', lastName:'B', phone:'', email:'', country:'OM' } });
    const userB = root.users[userBId];
    const bAcc = userB.accounts.find(a => a.type === 'MAIN' && a.currency === 'OMR');
    log('TEST 1 — User B created with 0 OMR', bAcc.balance === 0, 'B = ' + bAcc.balance);
    log('TEST 1 — User B has 0 cards', userB.cards.length === 0, '');
    log('TEST 1 — User B has 0 transactions', userB.transactions.length === 0, '');
    log('TEST 1 — User B yorId ≠ owner yorId', userBId !== PersistenceEngine.OWNER_YOR_ID, '');
    log('TEST 1 — Owner balance unchanged after create', ownerAcc.balance === ownerInitial, 'Owner = ' + ownerAcc.balance);

    const r1 = TransferEngine.atomicTransfer({ fromYorId: PersistenceEngine.OWNER_YOR_ID, toYorId: userBId, amount: 100, currency: 'OMR' });
    log('TEST 2 — Transfer executed', r1.ok === true, r1.error || '');
    log('TEST 2 — Fesal -100', Math.abs(ownerAcc.balance - (ownerInitial - 100)) < 1e-6, 'Fesal = ' + ownerAcc.balance);
    log('TEST 2 — User B +100', Math.abs(bAcc.balance - 100) < 1e-6, 'B = ' + bAcc.balance);

    const totalAfter = ownerAcc.balance + bAcc.balance;
    log('TEST 3 — Money conservation (frais=0)', Math.abs(totalAfter - ownerInitial) < 1e-6, ownerInitial + ' = ' + totalAfter);

    const r2a = TransferEngine.atomicTransfer({ fromYorId: PersistenceEngine.OWNER_YOR_ID, toYorId: userBId, amount: 50, currency: 'OMR' });
    const r2b = TransferEngine.atomicTransfer({ fromYorId: PersistenceEngine.OWNER_YOR_ID, toYorId: userBId, amount: 50, currency: 'OMR' });
    const onlyOne = (r2a.ok && !r2b.ok) || (!r2a.ok && r2b.ok);
    log('TEST 4 — Double submission blocked', onlyOne, 'a=' + r2a.ok + ' b=' + r2b.ok);
    const notifCount = userB.notifications.filter(n => n.type === 'TRANSFER_RECEIVED').length;
    log('TEST 4 — Exactly 2 received notifications (100+50)', notifCount === 2, 'count = ' + notifCount);

    const parsed = JSON.parse(JSON.stringify(PersistenceEngine.getRoot()));
    const fesalParsed = parsed.users[PersistenceEngine.OWNER_YOR_ID].accounts.find(a => a.type === 'MAIN').balance;
    const bParsed = parsed.users[userBId].accounts.find(a => a.type === 'MAIN').balance;
    log('TEST 5 — Fesal balance persists', Math.abs(fesalParsed - ownerAcc.balance) < 1e-6, '');
    log('TEST 5 — User B balance persists', Math.abs(bParsed - bAcc.balance) < 1e-6, '');
    log('TEST 5 — Notifications persist', parsed.users[userBId].notifications.length >= 3, '');

    const userCId = PersistenceEngine.createUser({ username: 'test_c_' + Date.now(), profile: { firstName:'User', lastName:'C', phone:'', email:'', country:'OM' } });
    const userC = root.users[userCId];
    const cAcc = userC.accounts.find(a => a.type === 'MAIN' && a.currency === 'OMR');
    log('TEST 6 — User C starts at 0', cAcc.balance === 0, 'C = ' + cAcc.balance);
    log('TEST 6 — B ≠ C yorIds', userBId !== userCId, '');
    log('TEST 6 — B balance unchanged by C create', Math.abs(bAcc.balance - 150) < 1e-6, 'B = ' + bAcc.balance);
  } finally {
    PersistenceEngine.restoreSnapshot(snapshot);
    console.log('— State restored to snapshot —');
  }
  const pass = results.every(r => r.pass);
  console.log(pass ? '✅ ALL TESTS PASSED' : '❌ ' + results.filter(r => !r.pass).length + ' TEST(S) FAILED');
  return results;
};
