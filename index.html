<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#050507">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>YOR WALLET</title>
<style>
:root{
  --bg:#050507;--bg-1:#0A0A0E;--bg-2:#0F0F14;--bg-3:#15151C;
  --glass-1:rgba(20,20,25,.55);--glass-2:rgba(20,20,25,.72);--glass-3:rgba(20,20,25,.85);
  --glass-hl:rgba(255,255,255,.07);--border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.14);
  --accent:#8B5CF6;--accent-600:#7C3AED;--accent-soft:rgba(139,92,246,.12);--accent-glow:rgba(139,92,246,.28);
  --success:#10B981;--success-bg:rgba(16,185,129,.12);--danger:#EF4444;--danger-bg:rgba(239,68,68,.12);
  --warning:#F59E0B;--warning-bg:rgba(245,158,11,.12);--info:#3B82F6;--info-bg:rgba(59,130,246,.12);
  --text:#F2F2F5;--text-2:rgba(242,242,245,.62);--text-3:rgba(242,242,245,.38);
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:26px;--r-2xl:32px;--r-pill:999px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;
  --z-bg:0;--z-content:1;--z-sticky:40;--z-nav:50;--z-modal:80;--z-sheet:90;--z-notif:110;--z-toast:100;
  --t-instant:100ms;--t-fast:180ms;--t-normal:300ms;--t-slow:500ms;--t-major:700ms;
  --ease:cubic-bezier(.2,.8,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
  --blur-sm:12px;--blur-md:20px;--blur-lg:32px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Roboto,system-ui,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono",ui-monospace,monospace;
  --font-ar:"SF Arabic","Noto Sans Arabic",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --vh:1vh;--kb:0px;
}
:root[data-theme="light"]{
  --bg:#F6F6F9;--bg-1:#FFF;--bg-2:#F0F0F4;--bg-3:#E8E8EE;
  --glass-1:rgba(255,255,255,.62);--glass-2:rgba(255,255,255,.78);--glass-3:rgba(255,255,255,.92);
  --glass-hl:rgba(255,255,255,.65);--border:rgba(10,10,30,.08);--border-2:rgba(10,10,30,.14);
  --text:#0A0A14;--text-2:rgba(10,10,20,.62);--text-3:rgba(10,10,20,.42);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);height:100%;min-height:100dvh;width:100%;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
html[dir="rtl"] body{font-family:var(--font-ar);letter-spacing:0}
button,input,select,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none;text-align:inherit}
button{cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:0;height:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

[data-i18n="common.prototype"],
[data-i18n="common.simulated"],
.receipt-disclaimer,
.prototype-label,
.settings-proto-label,
.badge[data-i18n*="simulated"],
[data-hide-demo]{display:none!important;visibility:hidden!important;height:0!important;overflow:hidden!important;pointer-events:none!important}

#app{position:relative;width:100vw;height:100vh;height:-webkit-fill-available;height:calc(var(--vh,1vh) * 100);height:100svh;height:100dvh;overflow:hidden;display:flex;padding-top:0;padding-left:var(--safe-l);padding-right:var(--safe-r)}
#sidebar{display:none;width:260px;flex-shrink:0;background:var(--glass-1);backdrop-filter:blur(var(--blur-lg)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur-lg)) saturate(180%);border-right:1px solid var(--border);padding:var(--sp-6) var(--sp-4);flex-direction:column;gap:var(--sp-8);z-index:var(--z-sticky);overflow-y:auto}
@media (min-width:1024px){#sidebar{display:flex}#app{padding-top:0}}
#main{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;padding-bottom:calc(72px + var(--safe-b))}
#main.no-nav{padding-bottom:var(--safe-b)}
#screens{flex:1;min-height:0;min-width:0;position:relative;overflow:hidden}
@media (min-width:1024px){#main{padding-bottom:0;height:100vh;height:calc(var(--vh,1vh) * 100);height:100svh;height:100dvh}#main.no-nav{padding-bottom:0}}
#ambient{position:absolute;inset:0;pointer-events:none;z-index:var(--z-bg);overflow:hidden}
#ambient::before,#ambient::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.35}
#ambient::before{width:600px;height:600px;top:-200px;left:-150px;background:radial-gradient(circle,rgba(139,92,246,.45),transparent 65%);animation:ambientFloat1 24s ease-in-out infinite}
#ambient::after{width:520px;height:520px;bottom:-180px;right:-120px;background:radial-gradient(circle,rgba(59,130,246,.28),transparent 65%);animation:ambientFloat2 28s ease-in-out infinite}
@keyframes ambientFloat1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
@keyframes ambientFloat2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-30px)}}

.screen{position:absolute;inset:0;z-index:var(--z-content);display:flex;flex-direction:column;background:transparent;opacity:0;visibility:hidden;--enter-x:22px;transform:translateX(var(--enter-x));transition:opacity 260ms var(--ease),transform 260ms var(--ease),visibility 0s linear 260ms;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;will-change:transform,opacity}
html[dir="rtl"] .screen{--enter-x:-22px}
.screen.from-back{--enter-x:-22px}
html[dir="rtl"] .screen.from-back{--enter-x:22px}
.screen.active{opacity:1;visibility:visible;transform:translateX(0);transition-delay:0s;z-index:var(--z-content);animation:screenClipIn 300ms cubic-bezier(.16,1,.3,1) both}
@keyframes screenClipIn{0%{clip-path:inset(0 0 100% 0 round 24px);opacity:0;transform:translateX(var(--enter-x)) translateY(6px) scale(.995)}100%{clip-path:inset(0 0 0 0 round 0);opacity:1;transform:none}}
.screen-body{padding:var(--sp-4) var(--sp-5) var(--sp-8);display:flex;flex-direction:column;gap:var(--sp-4);flex:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:calc(env(safe-area-inset-top,0px) + var(--sp-3)) var(--sp-5) var(--sp-3);min-height:60px;position:sticky;top:0;z-index:var(--z-sticky);background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 88%,transparent),transparent);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm))}
.topbar-title{font-size:16px;font-weight:600;letter-spacing:-.01em;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-back,.topbar-action{width:44px;height:44px;border-radius:var(--r-pill);background:var(--glass-1);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;transition:transform 160ms cubic-bezier(.2,1.4,.4,1),background 180ms,box-shadow 180ms;backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));position:relative;overflow:hidden}
.topbar-back::after,.topbar-action::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at center,var(--accent-soft),transparent 70%);opacity:0;transition:opacity 240ms;pointer-events:none}
.topbar-back:hover::after,.topbar-action:hover::after{opacity:1}
.topbar-back:active,.topbar-action:active{transform:scale(.9);background:var(--accent-soft)}
.topbar-back svg,.topbar-action svg{transition:transform 200ms cubic-bezier(.2,1.4,.4,1)}
.topbar-back:active svg{transform:translateX(-4px) scale(1.02)}
html[dir="rtl"] .topbar-back:active svg{transform:translateX(4px) scale(1.02)}
.topbar-action{color:var(--accent)}
html[dir="rtl"] .dir-flip{transform:scaleX(-1)}

.display{font-size:clamp(32px,8vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.08}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.h2{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.h3{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.body{font-size:15px;font-weight:400;color:var(--text-2);line-height:1.55}
.caption{font-size:12px;font-weight:500;color:var(--text-3);line-height:1.4}
.label{font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.amount{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.amount-xl{font-size:40px;line-height:1.05}
.amount-lg{font-size:26px;line-height:1.15}
.amount-md{font-size:17px;line-height:1.3}
.text-accent{color:var(--accent)}.text-success{color:var(--success)}.text-danger{color:var(--danger)}.text-warning{color:var(--warning)}.text-info{color:var(--info)}

.glass-subtle{background:var(--glass-1);backdrop-filter:blur(var(--blur-sm)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur-sm)) saturate(160%);border:1px solid var(--border);border-radius:var(--r-md)}
.glass{background:var(--glass-2);backdrop-filter:blur(var(--blur-md)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur-md)) saturate(180%);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--glass-hl),0 8px 24px rgba(0,0,0,.24)}
.glass-elevated{background:var(--glass-3);backdrop-filter:blur(var(--blur-lg)) saturate(200%);-webkit-backdrop-filter:blur(var(--blur-lg)) saturate(200%);border:1px solid var(--border-2);border-radius:var(--r-xl);box-shadow:inset 0 1px 0 var(--glass-hl),0 24px 60px rgba(0,0,0,.44)}
.glass,.glass-elevated,.select-item,.item,.contact-card,.country-row,.service-pill{animation:elementReveal 420ms cubic-bezier(.2,1,.4,1) both}
@keyframes elementReveal{0%{opacity:0;transform:translateY(10px) scale(.985);filter:blur(4px)}100%{opacity:1;transform:none;filter:blur(0)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 var(--sp-5);border-radius:var(--r-md);font-size:15px;font-weight:600;letter-spacing:-.005em;user-select:none;position:relative;overflow:hidden;transition:transform var(--t-fast) var(--ease),background var(--t-fast),opacity var(--t-fast),box-shadow var(--t-normal);width:100%}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-primary{background:linear-gradient(180deg,var(--accent),var(--accent-600));color:#fff;box-shadow:0 6px 20px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.28)}
.btn-secondary{background:var(--glass-1);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));border:1px solid var(--border-2);color:var(--text)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent)}
.btn-success{background:var(--success-bg);color:var(--success);border:1px solid color-mix(in srgb,var(--success) 30%,transparent)}
.btn-sm{min-height:40px;padding:0 var(--sp-4);font-size:13.5px;width:auto;border-radius:12px}

.field{display:flex;flex-direction:column;gap:var(--sp-2)}
.field-label{font-size:12.5px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.field-box{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 var(--sp-4);background:var(--glass-1);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));border:1.5px solid var(--border);border-radius:var(--r-md);transition:border-color var(--t-fast),box-shadow var(--t-normal),background var(--t-fast)}
.field-box:focus-within{border-color:var(--accent);background:var(--glass-2);box-shadow:0 0 0 4px var(--accent-soft),0 0 24px var(--accent-glow)}
.field-box input,.field-box textarea,.field-box select{flex:1;font-size:16px;font-weight:500;min-width:0;background:transparent;color:var(--text)}
.field-box input::placeholder{color:var(--text-3);font-weight:400}
.field-icon{color:var(--text-3);flex-shrink:0;font-weight:600;font-size:14px}
.field-err{font-size:12.5px;color:var(--danger);min-height:16px;font-weight:500}
.field-ok{font-size:12.5px;color:var(--success);min-height:16px;font-weight:500}
.amount-wrap{display:flex;align-items:baseline;justify-content:center;gap:var(--sp-3);padding:var(--sp-8) var(--sp-5) var(--sp-4);flex-direction:column;align-items:center;text-align:center}
.amount-wrap input{width:100%;text-align:center;font-family:var(--font-mono);font-weight:700;font-size:clamp(34px,9vw,46px);letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:transparent;color:var(--text);padding:0}
.amount-wrap input::placeholder{color:var(--text-3);opacity:.4}
.amount-cur{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--text-2);letter-spacing:.12em}

.item{display:flex;align-items:center;gap:var(--sp-3);padding:14px var(--sp-4);border-bottom:1px solid var(--border);width:100%;transition:background var(--t-fast),transform var(--t-fast);text-align:start;color:inherit;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none}
.item:last-child{border-bottom:none}
.item:active{background:var(--glass-2);transform:scale(.985)}
.item-body{flex:1;min-width:0}
.item-title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:12.5px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-right{flex-shrink:0;text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.item-amount{font-family:var(--font-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.item-amount.credit{color:var(--success)}
.item-chev{color:var(--text-3);flex-shrink:0}
.item-chev svg{width:18px;height:18px}
html[dir="rtl"] .item-chev svg{transform:scaleX(-1)}
.tile{width:42px;height:42px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;overflow:hidden;position:relative}
.tile svg{width:20px;height:20px}
.tile-solid{background:linear-gradient(180deg,var(--accent),var(--accent-600));color:#fff}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;background:var(--glass-2);color:var(--text-2);white-space:nowrap}
.badge svg{width:12px;height:12px}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-accent{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chip{padding:8px 16px;background:var(--glass-1);border:1.5px solid var(--border);border-radius:var(--r-pill);font-size:13px;font-weight:600;white-space:nowrap;color:var(--text-2);transition:all var(--t-fast);flex-shrink:0;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px var(--accent-glow)}

.bottom-nav{position:absolute;bottom:0;left:0;right:0;z-index:var(--z-nav);height:calc(72px + var(--safe-b));padding:0 var(--sp-4) var(--safe-b);display:flex;justify-content:space-around;align-items:stretch;background:var(--glass-2);backdrop-filter:blur(var(--blur-lg)) saturate(200%);-webkit-backdrop-filter:blur(var(--blur-lg)) saturate(200%);border-top:1px solid var(--border)}
@media (min-width:1024px){.bottom-nav{display:none}}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:10px;font-weight:600;transition:color var(--t-normal);position:relative;padding-top:6px;cursor:pointer}
.nav-item svg{width:22px;height:22px;transition:transform var(--t-normal)}
.nav-item[aria-current="page"]{color:var(--accent)}
.nav-item[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2.5px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.nav-cta .nav-cta-tile{width:46px;height:46px;border-radius:16px;background:linear-gradient(180deg,var(--accent),var(--accent-600));color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-18px;margin-bottom:4px;box-shadow:0 8px 24px var(--accent-glow)}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-item{display:flex;align-items:center;gap:var(--sp-3);padding:12px var(--sp-4);border-radius:var(--r-md);color:var(--text-2);font-size:14px;font-weight:500;transition:all var(--t-fast);cursor:pointer}
.side-item:hover{background:var(--glass-1);color:var(--text)}
.side-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-item svg{width:20px;height:20px;flex-shrink:0}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-2)}
.quick-item{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-2);border-radius:var(--r-lg);color:var(--text-2);font-size:11px;font-weight:500;transition:all var(--t-fast);cursor:pointer;background:transparent;border:none}
.quick-item:active{transform:scale(.94);background:var(--glass-1)}
.quick-icon{width:50px;height:50px;border-radius:16px;background:var(--glass-1);border:1px solid var(--border);color:var(--accent);display:flex;align-items:center;justify-content:center;transition:all var(--t-fast)}
.quick-icon svg{width:22px;height:22px}
.quick-item:active .quick-icon{background:var(--accent-soft);border-color:var(--accent-glow)}

.progress-steps{display:flex;align-items:center;gap:0;padding:var(--sp-4) var(--sp-4) var(--sp-5);overflow-x:auto;scrollbar-width:none}
.progress-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;min-width:60px;color:var(--text-3);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.progress-step-dot{width:24px;height:24px;border-radius:50%;background:var(--glass-1);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all var(--t-normal)}
.progress-step-dot svg{width:12px;height:12px}
.progress-step.done{color:var(--accent)}
.progress-step.done .progress-step-dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.progress-step.current{color:var(--text)}
.progress-step.current .progress-step-dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft),0 0 20px var(--accent-glow)}
.progress-line{flex:1;height:1.5px;background:var(--border);min-width:16px}
.progress-line.done{background:var(--accent)}

.select-list{display:flex;flex-direction:column;gap:var(--sp-2)}
.select-item{display:flex;align-items:center;gap:var(--sp-3);padding:14px var(--sp-4);background:var(--glass-1);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));border:1.5px solid var(--border);border-radius:var(--r-md);transition:all var(--t-fast);text-align:start;width:100%;cursor:pointer}
.select-item:active{transform:scale(.985)}
.select-item.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.select-flag{width:36px;height:26px;border-radius:6px;overflow:hidden;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.select-flag svg{width:100%;height:100%}
.select-body{flex:1;min-width:0}
.select-name{font-size:14.5px;font-weight:600;color:var(--text)}
.select-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.select-check{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;flex-shrink:0}
.select-check svg{width:12px;height:12px}
.select-item.selected .select-check{display:flex}
.prov-logo{width:40px;height:40px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;letter-spacing:.02em;overflow:hidden}

.country-row::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(139,92,246,.14),transparent);transition:left 700ms cubic-bezier(.2,1,.4,1)}

.country-body{flex:1;min-width:0}
.country-name{font-size:15px;font-weight:700;letter-spacing:-.01em}
.country-sub{font-size:12.5px;color:var(--text-3);margin-top:3px}

.service-pill{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--glass-1);border:1.5px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:all 200ms;text-align:start;width:100%}
.service-pill:active{transform:scale(.98);background:var(--accent-soft);border-color:var(--accent)}

.service-body{flex:1;min-width:0}
.service-name{font-size:14px;font-weight:600}
.service-sub{font-size:12px;color:var(--text-3);margin-top:3px}

.recog{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4);border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--glass-1);animation:recogIn var(--t-normal) var(--ease) both}
@keyframes recogIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.recog-found{border-color:color-mix(in srgb,var(--success) 45%,transparent);background:var(--success-bg)}

.recog-name{font-size:15px;font-weight:600;margin-top:3px;word-break:break-all}
.recog-meta{font-family:var(--font-mono);font-size:12.5px;color:var(--text-2);margin-top:3px}
.recog-enhanced{position:relative;overflow:hidden}
.recog-enhanced::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(139,92,246,.14),transparent);animation:recogShine 1.4s ease-out}

.recog-realname{font-size:13px;color:var(--text-2);font-weight:500;margin-top:6px;animation:fadeUp .5s .25s cubic-bezier(.2,1,.4,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.recog-scan{position:relative;overflow:hidden}
.recog-scan::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scanMove 1.6s linear infinite}
@keyframes scanMove{0%{top:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
.id-card-oman{padding:16px 18px;border-radius:16px;background:var(--glass-2);border:1.5px solid color-mix(in srgb,var(--success) 40%,transparent);animation:idReveal 500ms cubic-bezier(.2,1.2,.4,1) both;position:relative;overflow:hidden}
.id-card-oman::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(16,185,129,.18),transparent);animation:shineSweep 1.2s 200ms cubic-bezier(.2,1,.4,1) both}
@keyframes idReveal{0%{opacity:0;transform:translateY(12px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes shineSweep{to{left:100%}}

.contact-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--glass-1);border:1.5px solid var(--border);transition:all var(--t-fast)}

.contact-avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(180deg,var(--accent),var(--accent-600));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;letter-spacing:.02em}
.contact-info{flex:1;min-width:0}
.contact-number{font-family:var(--font-mono);font-size:14px;font-weight:600;letter-spacing:.02em}
.contact-name{font-size:13px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-fullname{font-size:11px;color:var(--text-3);margin-top:2px;font-weight:600;letter-spacing:.04em}
.contact-verified{width:18px;height:18px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact-verified svg{width:10px;height:10px}

.summary{background:var(--glass-1);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-1) var(--sp-4)}
.summary-row{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);padding:13px 0;border-bottom:1px solid var(--border)}
.summary-row:last-child{border-bottom:none}
.summary-k{font-size:13.5px;color:var(--text-2)}
.summary-v{font-family:var(--font-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:end}
.summary-row.total .summary-k{font-size:14.5px;color:var(--text);font-weight:600}
.summary-row.total .summary-v{font-size:17px;color:var(--accent);font-weight:700}

.swipe-track{position:relative;height:64px;border-radius:var(--r-pill);background:var(--glass-1);border:1.5px solid var(--border);overflow:hidden;user-select:none;touch-action:none}
.swipe-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent-600));width:0;box-shadow:0 0 24px var(--accent-glow)}
html[dir="rtl"] .swipe-fill{left:auto;right:0}
.swipe-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;letter-spacing:.06em;color:var(--text-2);pointer-events:none;text-transform:uppercase}
.swipe-thumb{position:absolute;top:5px;left:5px;width:54px;height:54px;border-radius:50%;background:linear-gradient(180deg,var(--accent),var(--accent-600));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px var(--accent-glow);cursor:grab;touch-action:none;z-index:2}

.swipe-thumb.success{background:linear-gradient(180deg,#34D399,var(--success))}

html[dir="rtl"] .swipe-thumb svg{transform:scaleX(-1)}

.proc-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--sp-10) var(--sp-5);gap:var(--sp-5);text-align:center;perspective:900px}
.proc-ring-wrap{position:relative;width:200px;height:200px;transform-style:preserve-3d}
.proc-ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--glass-1);stroke-width:6}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:6;stroke-linecap:round;stroke-dasharray:502.4;stroke-dashoffset:502.4;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 12px var(--accent-glow))}
.ring-halo{position:absolute;inset:-20px;border-radius:50%;border:1px solid var(--accent-soft);animation:haloPulse 2.4s ease-in-out infinite;pointer-events:none}
@keyframes haloPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.06);opacity:.9}}
.proc-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.proc-num{font-family:var(--font-mono);font-size:48px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.proc-unit{font-size:10px;color:var(--text-3);letter-spacing:.24em;margin-top:4px;text-transform:uppercase}
.proc-amount{font-family:var(--font-mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.proc-label{font-size:15px;font-weight:500;color:var(--text-2);max-width:320px}
.proc-meta{font-size:12.5px;color:var(--text-3)}
.proc-dots{display:flex;gap:6px}
.proc-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dotPulse 1.4s infinite ease-in-out}
.proc-dots span:nth-child(2){animation-delay:.2s}
.proc-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

.timing-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--glass-1);border:1px solid var(--border);width:100%;max-width:340px}
.timing-step{flex:1;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.timing-step.active{color:var(--accent)}
.timing-step.done{color:var(--success)}
.timing-dot{width:8px;height:8px;border-radius:50%;background:var(--border);margin:0 auto 6px}
.timing-dot.done{background:var(--success);box-shadow:0 0 10px var(--success)}
.timing-dot.active{background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulseDot 1.4s ease-in-out infinite}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}

.receipt-view{padding:calc(env(safe-area-inset-top,0px) + var(--sp-4)) var(--sp-5) var(--sp-8);display:flex;flex-direction:column;gap:var(--sp-4)}
.receipt-head{display:flex;justify-content:space-between;align-items:center;padding:var(--sp-2) 0}
.receipt-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--sp-6) var(--sp-4) var(--sp-4)}
.success-ring{width:96px;height:96px;border-radius:50%;background:linear-gradient(160deg,#34D399,var(--success));display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px color-mix(in srgb,var(--success) 10%,transparent),0 20px 48px color-mix(in srgb,var(--success) 38%,transparent);animation:successPop var(--t-slow) cubic-bezier(.2,1.4,.4,1) both;position:relative}
.success-ring::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid color-mix(in srgb,var(--success) 26%,transparent);animation:haloPulse 2.6s ease-in-out infinite}
@keyframes successPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.success-ring svg{width:46px;height:46px;color:#fff}
.receipt-title{font-size:24px;font-weight:700;letter-spacing:-.025em;margin-top:var(--sp-4)}
.receipt-sub{font-size:14px;color:var(--text-2);max-width:320px;margin-top:6px;line-height:1.45}
.receipt-panel{padding:var(--sp-5)}
.receipt-benef{display:flex;align-items:flex-start;gap:var(--sp-3)}
.receipt-avatar{width:52px;height:52px;border-radius:var(--r-pill);flex-shrink:0;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.receipt-avatar svg{width:24px;height:24px}
.receipt-benef-body{flex:1;min-width:0}
.receipt-benef-label{font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.receipt-benef-name{font-size:16px;font-weight:700;margin-top:6px;word-break:break-word}
.receipt-benef-phone{font-family:var(--font-mono);font-size:13px;color:var(--text-2);margin-top:6px}
.receipt-benef-country{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);margin-top:10px}
.receipt-flag{width:20px;height:14px;border-radius:3px;overflow:hidden;flex-shrink:0}
.receipt-saved{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;font-size:10.5px;font-weight:700;background:var(--success-bg);color:var(--success);border-radius:var(--r-pill)}
.receipt-service{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--border)}
.receipt-service-icon{width:44px;height:44px;border-radius:14px;flex-shrink:0;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.receipt-service-body{flex:1;min-width:0}
.receipt-service-name{font-size:14.5px;font-weight:600}
.receipt-service-via{font-size:12.5px;color:var(--text-2);margin-top:3px}
.receipt-row{display:flex;align-items:center;gap:var(--sp-3);padding:13px 0;border-bottom:1px solid var(--border)}
.receipt-row:last-child{border-bottom:none}
.receipt-row-icon{width:36px;height:36px;border-radius:12px;flex-shrink:0;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.receipt-row-icon svg{width:17px;height:17px}
.receipt-row-label{flex:1;font-size:14px;color:var(--text-2)}
.receipt-row-value{font-family:var(--font-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:end;word-break:break-word}
.receipt-row.total .receipt-row-label{font-weight:600;color:var(--text);font-size:14.5px}
.receipt-row.total .receipt-row-value{color:var(--accent);font-size:17px;font-weight:700}
.receipt-row.total .receipt-row-icon{background:linear-gradient(180deg,var(--accent),var(--accent-600));color:#fff}
.receipt-meta{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
.receipt-meta-item{display:flex;gap:10px;align-items:flex-start}
.receipt-meta-icon{width:34px;height:34px;border-radius:11px;flex-shrink:0;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.receipt-meta-icon svg{width:16px;height:16px}
.receipt-meta-label{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.receipt-meta-value{font-size:13.5px;font-weight:600;margin-top:4px;word-break:break-word}
.receipt-meta-value.ok{color:var(--success)}
.receipt-meta-value.copy{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);word-break:break-all}
.receipt-meta-value.copy svg{width:12px;height:12px;color:var(--text-3)}
.receipt-footer{display:flex;justify-content:center;padding:var(--sp-5) 0 var(--sp-3);opacity:.85}
.receipt-actions{display:flex;gap:var(--sp-3)}

.card-3d-wrap{perspective:1400px;margin:var(--sp-4) auto;width:100%;max-width:400px;padding:0 var(--sp-5)}
.card-3d{aspect-ratio:1.586;width:100%;position:relative;transform-style:preserve-3d;--tiltX:0deg;--tiltY:0deg;transform:rotateX(var(--tiltX)) rotateY(var(--tiltY));transition:transform 260ms cubic-bezier(.2,1,.4,1);cursor:pointer;will-change:transform}
.card-3d.flipped{transform:rotateX(var(--tiltX)) rotateY(calc(180deg + var(--tiltY)));transition:transform 600ms cubic-bezier(.2,1,.4,1)}
@media (hover: none){.card-3d{--tiltX:0deg !important;--tiltY:0deg !important}}
.card-face{position:absolute;inset:0;border-radius:var(--r-lg);padding:var(--sp-5);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden}
.card-front{background:radial-gradient(80% 60% at 100% 0%,rgba(139,92,246,.5),transparent 60%),radial-gradient(60% 50% at 0% 100%,rgba(59,130,246,.35),transparent 60%),linear-gradient(135deg,#1A1A2E,#0F0F1A 60%,#050507);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.5)}
.card-front-top{display:flex;justify-content:space-between;align-items:flex-start}
.card-brand{font-size:11.5px;font-weight:800;letter-spacing:.24em;opacity:.9}
.card-network{font-size:22px;font-weight:900;font-style:italic}
.card-chip{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#F4D58D,#B8912F);margin-top:auto}
.card-number{font-family:var(--font-mono);font-size:19px;font-weight:600;letter-spacing:.14em;margin-top:14px;direction:ltr}
.card-bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;font-size:11px}
.card-bottom .lbl{font-size:9px;opacity:.62;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.card-back{background:linear-gradient(135deg,#1A1A2E,#0A0A14);transform:rotateY(180deg);padding:0;border:1px solid rgba(255,255,255,.1)}
.magstripe{height:46px;background:#000;margin-top:26px}
.cvv-strip{background:#fff;color:#0A0A14;margin:20px;padding:12px 16px;border-radius:8px;font-family:var(--font-mono);font-size:16px;font-weight:700;display:flex;justify-content:flex-end;letter-spacing:.1em;direction:ltr}

.section{display:flex;align-items:center;justify-content:space-between;margin:var(--sp-4) 0 var(--sp-2)}
.section-title{font-size:14px;font-weight:700}
.section-action{font-size:13px;font-weight:600;color:var(--accent);padding:4px;cursor:pointer}
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);padding:var(--sp-10) var(--sp-6);text-align:center;color:var(--text-2)}
.empty svg{width:56px;height:56px;opacity:.3;color:var(--accent)}
.empty-title{font-size:15px;font-weight:600;color:var(--text)}
.empty-sub{font-size:13px;max-width:280px;line-height:1.5}

#toasts{position:absolute;top:calc(var(--safe-t) + 68px);left:var(--sp-4);right:var(--sp-4);z-index:var(--z-toast);display:flex;flex-direction:column;gap:var(--sp-2);pointer-events:none}
.toast{padding:14px 16px;border-radius:var(--r-md);background:var(--glass-3);backdrop-filter:blur(var(--blur-lg));-webkit-backdrop-filter:blur(var(--blur-lg));border:1px solid var(--border-2);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:10px;animation:toastIn var(--t-normal);pointer-events:auto;box-shadow:0 12px 32px rgba(0,0,0,.4);will-change:transform,opacity}
.toast.success{border-color:color-mix(in srgb,var(--success) 40%,transparent);background:color-mix(in srgb,var(--success) 14%,var(--glass-3))}
.toast.error{border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:color-mix(in srgb,var(--danger) 14%,var(--glass-3))}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}

#notif-layer{position:absolute;top:calc(var(--safe-t) + 12px);left:var(--sp-3);right:var(--sp-3);z-index:var(--z-notif);display:flex;flex-direction:column;gap:var(--sp-2);pointer-events:none;max-width:480px;margin:0 auto}
.notif-ios{pointer-events:auto;padding:14px 16px;border-radius:18px;background:var(--glass-3);backdrop-filter:blur(var(--blur-lg)) saturate(200%);-webkit-backdrop-filter:blur(var(--blur-lg)) saturate(200%);border:1px solid var(--border-2);box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 var(--glass-hl);display:flex;gap:12px;align-items:flex-start;animation:notifIn 380ms cubic-bezier(.2,1,.4,1) both;cursor:pointer;will-change:transform,opacity}
@keyframes notifIn{from{opacity:0;transform:translateY(-24px) scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.notif-ios.dismiss{animation:notifOut 260ms cubic-bezier(.4,0,1,1) both}
@keyframes notifOut{to{opacity:0;transform:translateY(-24px) scale(.94);filter:blur(8px)}}
.notif-ios-icon{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.notif-ios-icon.success{background:var(--success-bg);color:var(--success)}
.notif-ios-icon.warning{background:var(--warning-bg);color:var(--warning)}
.notif-ios-body{flex:1;min-width:0}
.notif-ios-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.notif-ios-app{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}

.crypto-activity-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.crypto-activity-row:last-child{border-bottom:none}
.crypto-activity-row:active{background:var(--glass-2)}
.crypto-activity-icon{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.crypto-activity-icon.credit{background:var(--success-bg);color:var(--success)}
.crypto-activity-icon.debit{background:var(--danger-bg);color:var(--danger)}
.crypto-activity-body{flex:1;min-width:0}
.crypto-activity-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crypto-activity-sub{font-size:11.5px;color:var(--text-3);margin-top:2px}
.crypto-activity-amount{font-family:var(--font-mono);font-size:13px;font-weight:700;text-align:end}
.crypto-activity-amount.credit{color:var(--success)}
.crypto-spot-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:var(--sp-4)}
.crypto-spot-actions button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:var(--r-md);background:var(--glass-1);border:1px solid var(--border);color:var(--text);font-size:11.5px;font-weight:600;transition:all var(--t-fast);cursor:pointer;min-height:56px}
.crypto-spot-actions button:active{transform:scale(.96);background:var(--accent-soft);border-color:var(--accent)}
.crypto-spot-actions button.primary{background:linear-gradient(180deg,var(--accent),var(--accent-600));border-color:var(--accent);color:#fff}

    if (o && o.users && o.schema === SCHEMA){ root = o; invalidateView(); }
  }

  function saveSession(extra){ try { localStorage.setItem(SESSION_KEY, JSON.stringify(Object.assign({ at: Date.now() }, extra || {}))); } catch(e){} }
  function clearSession(){ try { localStorage.removeItem(SESSION_KEY); } catch(e){} }
  function readSession(){ try { return parse(localStorage.getItem(SESSION_KEY)); } catch(e){ return null; } }

  function log(type, data){
    const s = get();
    if (s.actionLog){
      s.actionLog.push({ at: Date.now(), type: String(type), data: data === undefined ? null : data });
      if (s.actionLog.length > LOG_MAX) s.actionLog.splice(0, s.actionLog.length - LOG_MAX);
    }
    persist();
  }
  function saveDraft(kind, value){ const s = get(); s.drafts[kind] = value; s.drafts.savedAt = Date.now(); persist(); }
  function loadDraft(kind){ const s = get(); return (s.drafts && s.drafts[kind]) || null; }
  function clearDraft(kind){ const s = get(); if (s.drafts && s.drafts[kind]){ s.drafts[kind] = null; persist(); } }

  return {
    get, set, save: persist, flush, flushSync,
    saveSession, clearSession, readSession,
    log, saveDraft, loadDraft, clearDraft,
    syncExternal, getRoot, createUser, findUserByYorId, getUserCount,
    genYorId, restoreSnapshot, invalidateView,
    status(){ return { dirty, error: lastError ? String(lastError.message || lastError) : null, schema: SCHEMA, users: getUserCount() }; },
    reset(){ try { localStorage.removeItem(KEY); localStorage.removeItem(BAK_KEY); localStorage.removeItem(SESSION_KEY); } catch(e){} root = null; invalidateView(); },
    KEY, SESSION_KEY, OWNER_YOR_ID, SCHEMA
  };
})();

/* ============ AUTH ENGINE (multi-utilisateur) ============ */
const AUTH_CONFIG = Object.freeze({
  PRIMARY_USERNAME: 'fesal.said',
  CONFIRM_CODE: '050069',
  CODE_LENGTH: 6,
  MAX_ATTEMPTS: 5,
  LOCK_MS: 60 * 1000,
  SESSION_TTL_MS: 30 * 24 * 60 * 60 * 1000,
  USERNAME_RE: /^[a-z0-9][a-z0-9._-]{2,23}$/
});
const AuthEngine = (() => {
  const C = AUTH_CONFIG;
  const norm = u => String(u == null ? '' : u).trim().toLowerCase();
  function digest(username, code){
    const str = 'yor|' + username + '|' + code + '|v1';
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0; h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0; h2 ^= h2 >>> 13; }
    return h1.toString(16) + '.' + h2.toString(16);
  }
  const LocalProvider = {
    name: 'local',
    all(){ return PersistenceEngine.getRoot().auth.accounts || []; },
    find(u){ return LocalProvider.all().find(a => a.username === u) || null; },
    check(u, code){
      const a = LocalProvider.find(u);
      if (!a) return false;
      return a.primary ? code === C.CONFIRM_CODE : a.codeHash === digest(u, code);
    },
    create(rec){
      const r = PersistenceEngine.getRoot();
      r.auth.accounts.push(rec);
      PersistenceEngine.save();
      return rec;
    }
  };
  let provider = LocalProvider;

  function lockState(){
    const r = PersistenceEngine.getRoot();
    const rec = r.users[r.auth.current];
    const sec = (rec && rec.security) || (r.__lockFallback = r.__lockFallback || { failedAttempts:0, lockUntil:0 });
    const now = Date.now();
    if (sec.lockUntil && sec.lockUntil > now) return { locked: true, retryIn: Math.ceil((sec.lockUntil - now) / 1000) };
    if (sec.lockUntil){ sec.lockUntil = 0; sec.failedAttempts = 0; PersistenceEngine.save(); }
    return { locked: false, retryIn: 0 };
  }
  function failure(){
    const r = PersistenceEngine.getRoot();
    const rec = r.users[r.auth.current];
    const sec = (rec && rec.security) || (r.__lockFallback = r.__lockFallback || { failedAttempts:0, lockUntil:0 });
    sec.failedAttempts = (sec.failedAttempts || 0) + 1;
    PersistenceEngine.log('auth.fail', { n: sec.failedAttempts });
    if (sec.failedAttempts >= C.MAX_ATTEMPTS){
      sec.lockUntil = Date.now() + C.LOCK_MS;
      sec.failedAttempts = 0;
      PersistenceEngine.save();
      return { ok:false, error:'locked', retryIn: Math.ceil(C.LOCK_MS / 1000) };
    }
    PersistenceEngine.save();
    return { ok:false, error:'invalid' };
  }
  function clearFails(){
    const r = PersistenceEngine.getRoot();
    const rec = r.users[r.auth.current];
    if (rec && rec.security){ rec.security.failedAttempts = 0; rec.security.lockUntil = 0; }
    r.__lockFallback = { failedAttempts: 0, lockUntil: 0 };
    PersistenceEngine.save();
  }

  function start(acc){
    if (!acc || !acc.yorId) return false;
    const r = PersistenceEngine.getRoot();
    if (!r.users[acc.yorId]) return false;
    r.authed = true;
    r.auth.current = acc.yorId;
    PersistenceEngine.invalidateView();
    PersistenceEngine.save();
    PersistenceEngine.saveSession({ yorId: acc.yorId, username: acc.username, expiresAt: Date.now() + C.SESSION_TTL_MS });
    PersistenceEngine.log('auth.login', { user: acc.username, yorId: acc.yorId });
    return true;
  }

  async function login(usernameRaw, codeRaw){
    const u = norm(usernameRaw), code = String(codeRaw == null ? '' : codeRaw).trim();
    const lk = lockState();
    if (lk.locked) return { ok:false, error:'locked', retryIn: lk.retryIn };
    if (!u || !code) return { ok:false, error:'empty' };
    let ok = false;
    try { ok = await provider.check(u, code); } catch(e){ return { ok:false, error:'unavailable' }; }
    if (!ok) return failure();
    clearFails();
    const acc = provider.find(u);
    if (!acc) return { ok:false, error:'invalid' };
    start(acc);
    return { ok:true, username:u, yorId: acc.yorId };
  }

  async function register(p){
    p = p || {};
    const name = String(p.name || '').trim().replace(/\s+/g, ' ');
    const u = norm(p.username);
    const code = String(p.code || ''), code2 = String(p.code2 || '');
    if (name.length < 2) return { ok:false, error:'name', field:'name' };
    if (!C.USERNAME_RE.test(u)) return { ok:false, error:'userFormat', field:'username' };
    if (!/^\d{6}$/.test(code)) return { ok:false, error:'codeFormat', field:'code' };
    if (code !== code2) return { ok:false, error:'mismatch', field:'code2' };
    if (await provider.find(u)) return { ok:false, error:'taken', field:'username' };

    const parts = name.split(' ');
    const profile = { firstName: parts[0], lastName: parts.slice(1).join(' '), phone: '', email: '', country: 'OM' };

    /* 1) Créer un utilisateur VIERGE — soldes à zéro, isolé du propriétaire */
    const yorId = PersistenceEngine.createUser({ username: u, profile });

    /* 2) Enregistrer les identifiants, liés au nouveau yorId (JAMAIS celui du propriétaire) */
    const authRec = { id: ID.user(), username: u, codeHash: digest(u, code), yorId, createdAt: Date.now() };
    provider.create(authRec);

    PersistenceEngine.log('auth.register', { user: u, yorId });

    /* 3) Démarrer la session du NOUVEAU compte */
    start(authRec);
    return { ok:true, username: u, yorId };
  }

  function restore(){
    const r = PersistenceEngine.getRoot();
    const ses = PersistenceEngine.readSession();
    const valid = !!(ses && ses.yorId && ses.expiresAt > Date.now() && r.users[ses.yorId]);
    if (valid){
      if (!r.authed || r.auth.current !== ses.yorId){
        r.authed = true; r.auth.current = ses.yorId;
        PersistenceEngine.invalidateView();
        PersistenceEngine.save();
      }
    } else if (r.authed || r.auth.current){
      r.authed = false; r.auth.current = null;
      PersistenceEngine.invalidateView();
      PersistenceEngine.save();
    }
    return valid;
  }

  function logout(){
    const r = PersistenceEngine.getRoot();
    const yid = r.auth.current;
    r.authed = false; r.auth.current = null;
    PersistenceEngine.invalidateView();
    PersistenceEngine.save();
    PersistenceEngine.clearSession();
    PersistenceEngine.log('auth.logout', { yorId: yid });
  }

  async function confirmAction(codeRaw){
    const r = PersistenceEngine.getRoot();
    if (!r.authed || !r.auth.current) return { ok:false, error:'unauthenticated' };
    const acc = LocalProvider.all().find(a => a.yorId === r.auth.current);
    if (!acc) return { ok:false, error:'unauthenticated' };
    const lk = lockState(); if (lk.locked) return { ok:false, error:'locked', retryIn: lk.retryIn };
    let ok = false;
    try { ok = await provider.check(acc.username, String(codeRaw == null ? '' : codeRaw).trim()); } catch(e){ return { ok:false, error:'unavailable' }; }
    if (!ok) return failure();
    clearFails();
    return { ok: true };
  }

  return { login, register, logout, restore, confirmAction,
           isAuthed: () => !!PersistenceEngine.getRoot().authed,
           current:  () => PersistenceEngine.getRoot().auth.current,
           lockState, setProvider(p){ if (p && p.find && p.check && p.create) provider = p; }, config: C };
})();

/* ============ TRANSFER ENGINE — transfert P2P atomique ============ */
const TransferEngine = (() => {
  const inflight = new Set();
  const round3 = n => Math.round(n * 1000) / 1000;

  function resolve(yorId){
    const rec = PersistenceEngine.findUserByYorId(yorId);
    if (!rec) return null;
    const main = rec.accounts.find(a => a.type === 'MAIN');
    return {
      yorId: rec.yorId,
      role: rec.role,
      name: ((rec.profile.firstName || '') + ' ' + (rec.profile.lastName || '')).trim() || rec.username || rec.yorId,
      firstName: rec.profile.firstName,
      lastName: rec.profile.lastName,
      phone: rec.profile.phone,
      country: rec.profile.country,
      kycStatus: rec.profile.kyc && rec.profile.kyc.status,
      mainCurrency: main ? main.currency : 'OMR'
    };
  }
  function findAccount(rec, currency){
    const main = rec.accounts.find(a => a.type === 'MAIN' && a.currency === currency);
    if (main) return main;
    return rec.accounts.find(a => a.currency === currency);
  }
  function newTransferId(){
    const d = new Date();
    const ymd = '' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    return 'YOR-TX-' + ymd + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  }

  function atomicTransfer({ fromYorId, toYorId, amount, currency, note }){
    amount = Number(amount);
    currency = String(currency || 'OMR').toUpperCase();
    if (!(amount > 0)) return { ok:false, error:'INVALID_AMOUNT' };
    if (!fromYorId || !toYorId) return { ok:false, error:'INVALID_ACCOUNT' };
    if (fromYorId === toYorId) return { ok:false, error:'SELF_TRANSFER' };

    const lockKey = fromYorId + '->' + toYorId + ':' + amount.toFixed(3) + ':' + currency;
    if (inflight.has(lockKey)) return { ok:false, error:'DUPLICATE' };
    inflight.add(lockKey);

    try {
      const root = PersistenceEngine.getRoot();
      const sender = root.users[fromYorId];
      const receiver = root.users[toYorId];
      if (!sender) return { ok:false, error:'SENDER_NOT_FOUND' };
      if (!receiver) return { ok:false, error:'RECIPIENT_NOT_FOUND' };

      const senderAcc = findAccount(sender, currency);
      const receiverAcc = findAccount(receiver, currency);
      if (!senderAcc) return { ok:false, error:'SENDER_ACCOUNT_MISSING' };
      if (!receiverAcc) return { ok:false, error:'RECIPIENT_ACCOUNT_MISSING' };
      if (senderAcc.availableBalance + 1e-9 < amount) return { ok:false, error:'INSUFFICIENT_BALANCE' };

      const transferId = newTransferId();
      const now = Date.now();
      const senderName = ((sender.profile.firstName || '') + ' ' + (sender.profile.lastName || '')).trim() || sender.yorId;
      const receiverName = ((receiver.profile.firstName || '') + ' ' + (receiver.profile.lastName || '')).trim() || receiver.yorId;

      /* DEBIT sender */
      senderAcc.balance = round3(senderAcc.balance - amount);
      senderAcc.availableBalance = round3(senderAcc.availableBalance - amount);
      senderAcc.updatedAt = now;

      /* CREDIT receiver */
      receiverAcc.balance = round3(receiverAcc.balance + amount);
      receiverAcc.availableBalance = round3(receiverAcc.availableBalance + amount);
      receiverAcc.updatedAt = now;

      const senderTxId = ID.transaction();
      const receiverTxId = ID.transaction();
      const senderTx = {
        id: senderTxId, transferId, reference: transferId,
        type:'INTERNAL_TRANSFER', direction:'OUT', status:'SUCCESS',
        amount, currency, fee:0, vat:0, total: amount,
        sourceAccountId: senderAcc.id,
        counterpart: { yorId: receiver.yorId, name: receiverName, phone: receiver.profile.phone, country: receiver.profile.country },
        beneficiary: { id:null, name: receiverName, phone: receiver.profile.phone, country: receiver.profile.country, yorId: receiver.yorId },
        note: note || null, createdAt: now, completedAt: now, txnTypeLabel:'INTERNAL_TRANSFER'
      };
      const receiverTx = {
        id: receiverTxId, transferId, reference: transferId,
        type:'INTERNAL_TRANSFER', direction:'IN', status:'SUCCESS',
        amount, currency, fee:0, vat:0, total: amount,
        destinationAccountId: receiverAcc.id,
        counterpart: { yorId: sender.yorId, name: senderName, phone: sender.profile.phone, country: sender.profile.country },
        beneficiary: { id:null, name: senderName, phone: sender.profile.phone, country: sender.profile.country, yorId: sender.yorId },
        note: note || null, createdAt: now, completedAt: now, txnTypeLabel:'INTERNAL_TRANSFER'
      };
      sender.transactions.unshift(senderTx);
      receiver.transactions.unshift(receiverTx);

      const senderNotif = {
        id: ID.notification(), userId: sender.yorId, transferId, transactionId: senderTxId,
        type:'TRANSFER_SENT', title: 'Transfert envoyé',
        message: `${amount.toFixed(3)} ${currency} envoyé à ${receiverName}`,
        read:false, priority:'NORMAL', createdAt: now
      };
      const receiverNotif = {
        id: ID.notification(), userId: receiver.yorId, transferId, transactionId: receiverTxId,
        type:'TRANSFER_RECEIVED', title: 'Payment received',
        message: `${senderName} sent you ${amount.toFixed(3)} ${currency}`,
        read:false, priority:'HIGH', createdAt: now
      };
      sender.notifications.unshift(senderNotif);
      receiver.notifications.unshift(receiverNotif);

      sender.ledger.unshift({ id: ID.event(), txId: senderTxId, transferId, accountId: senderAcc.id, delta: -amount, currency, at: now });
      receiver.ledger.unshift({ id: ID.event(), txId: receiverTxId, transferId, accountId: receiverAcc.id, delta: amount, currency, at: now });

      PersistenceEngine.save();
      return { ok:true, transferId, senderTx, receiverTx, senderNotif, receiverNotif };
    } finally {
      setTimeout(() => inflight.delete(lockKey), 1500);
    }
  }

  return { resolve, atomicTransfer, findAccount };
})();

/* ============ EXCHANGE ENGINE ============ */
const ExchangeEngine = Object.freeze({
  isCrypto(sym){ return Object.prototype.hasOwnProperty.call(CRYPTO_PRICES_SEED, String(sym||'').toUpperCase()); },
  cryptoUSD(sym){
    const s = String(sym||'').toUpperCase();
    try {
      const assets = PersistenceEngine.get().cryptoAssets;
      const a = assets && assets.find(x=>x.symbol === s);
      if (a && a.price > 0) return a.price;
    } catch(e){}
    return (CRYPTO_PRICES_SEED[s] || { usd:0 }).usd;
  },
  rate(from, to){
    if (!from || !to) return null;
    from = String(from).toUpperCase();
    to   = String(to).toUpperCase();
    if (from === to) return 1;
    let rates;
    try { rates = PersistenceEngine.get().exchangeRates || FX_RATES; } catch(e){ rates = FX_RATES; }
    const fc = ExchangeEngine.isCrypto(from);
    const tc = ExchangeEngine.isCrypto(to);
    if (fc && tc){
      const pf = ExchangeEngine.cryptoUSD(from);
      const pt = ExchangeEngine.cryptoUSD(to);
      return pt > 0 ? pf / pt : null;
    }
    if (fc){
      const pUSD = ExchangeEngine.cryptoUSD(from);
      const rateToOMR = rates['USD'] ? 1 / rates['USD'] : null;
      if (!rateToOMR) return null;
      const omrAmount = pUSD * rateToOMR;
      if (to === 'OMR') return omrAmount;
      return rates[to] != null ? omrAmount * rates[to] : null;
    }
    if (tc){
      const pUSD = ExchangeEngine.cryptoUSD(to);
      if (pUSD <= 0) return null;
      const omrToUSD = rates['USD'] || 2.6008;
      if (from === 'OMR') return (1 * omrToUSD) / pUSD;
      if (rates[from] != null){
        const omrAmount = 1 / rates[from];
        return (omrAmount * omrToUSD) / pUSD;
      }
      return null;
    }
    if (from === 'OMR') return rates[to] != null ? rates[to] : null;
    if (to === 'OMR')   return rates[from] != null ? 1 / rates[from] : null;
    if (rates[from] != null && rates[to] != null) return rates[to] / rates[from];
    return null;
  },
  convert(amount, from, to){
    const r = ExchangeEngine.rate(from, to);
    if (r == null) return null;
    return {
      amount: Math.round(amount * r * 1e8) / 1e8,
      rate: r,
      from: String(from).toUpperCase(),
      to:   String(to).toUpperCase()
    };
  }
});

/* ============ CURRENCY ENGINE ============ */
const CurrencyEngine = Object.freeze({
  meta(c){ return CURRENCY_DEF[String(c||'').toUpperCase()] || CURRENCY_DEF.USD; },
  _locale(c){
    if (typeof LANG !== 'undefined'){
      if (LANG === 'ar') return 'ar-OM';
      if (LANG === 'en') return 'en-US';
    }
    return 'fr-FR';
  },
  format(a, c, locale){
    c = String(c||'OMR').toUpperCase();
    const m = CurrencyEngine.meta(c);
    const loc = locale || CurrencyEngine._locale(c);
    const n = Number(a || 0);
    if (loc === 'ar-OM'){
      return n.toLocaleString('fr-FR', { minimumFractionDigits:m.decimals, maximumFractionDigits:m.decimals }) + ' ' + c;
    }
    return n.toLocaleString(loc, { minimumFractionDigits:m.decimals, maximumFractionDigits:m.decimals }) + ' ' + c;
  },
  formatCrypto(a, sym){
    const s = String(sym||'').toUpperCase();
    const m = CurrencyEngine.meta(s);
    const n = Number(a || 0);
    const maxDec = s === 'BTC' ? 8 : s === 'ETH' ? 6 : Math.min(m.decimals, 8);
    const minDec = n > 0 && n < 0.001 ? 4 : 0;
    return n.toLocaleString('en-US', { minimumFractionDigits:minDec, maximumFractionDigits:maxDec }) + ' ' + s;
  },
  formatFiat(a, c){ return CurrencyEngine.format(a, c || 'USD'); },
  getRate(from, to){ return ExchangeEngine.rate(from, to); },
  convert(amount, from, to){ return ExchangeEngine.convert(amount, from, to); }
});

/* ============ ADDRESS ENGINE ============ */
const AddressEngine = Object.freeze({
  validate(networkId, address){
    const a = String(address||'').trim();
    if (a.length < 10) return { ok:false, error:'INVALID_ADDRESS' };
    switch(networkId){
      case 'bitcoin': return /^(bc1|[13])[a-zA-HJ-NP-Z0-9]{20,}$/.test(a) ? {ok:true} : {ok:false};
      case 'ethereum': case 'bsc': case 'polygon': case 'arbitrum': case 'optimism': case 'avalanche': return /^0x[a-fA-F0-9]{40}$/.test(a) ? {ok:true} : {ok:false};
      case 'tron': return /^T[a-zA-HJ-NP-Z0-9]{33}$/.test(a) ? {ok:true} : {ok:false};
      case 'solana': return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a) ? {ok:true} : {ok:false};
      case 'xrp': return /^r[a-zA-HJ-NP-Z0-9]{24,}$/.test(a) ? {ok:true} : {ok:false};
      case 'litecoin': return /^(ltc1|[LM3])[a-zA-HJ-NP-Z0-9]{20,}$/.test(a) ? {ok:true} : {ok:false};
      default: return a.length >= 20 ? {ok:true} : {ok:false};
    }
  },
  short(a){ if (!a || a.length < 14) return a || ''; return a.slice(0,8) + '…' + a.slice(-6); },
  generate(networkId){
    const rnd = n => { let s=''; const chars='abcdefghijklmnopqrstuvwxyz0123456789'; for(let i=0;i<n;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; };
    const rndHex = n => { let s=''; for(let i=0;i<n;i++) s+='0123456789abcdef'[Math.floor(Math.random()*16)]; return s; };
    switch(networkId){
      case 'bitcoin': return 'bc1q' + rnd(38).toLowerCase();
      case 'ethereum': case 'bsc': case 'polygon': case 'arbitrum': case 'optimism': case 'avalanche': return '0x' + rndHex(40);
      case 'tron': return 'T' + rnd(33).toUpperCase();
      case 'solana': return rnd(44);
      case 'xrp': return 'r' + rnd(33);
      case 'litecoin': return 'ltc1q' + rnd(38).toLowerCase();
      default: return rnd(40);
    }
  },
  requiresMemo(networkId){ return networkId === 'xrp'; }
});

const CryptoWalletEngine = Object.freeze({
  all(){ return PersistenceEngine.get().cryptoWallets; },
  byAsset(assetId){ return CryptoWalletEngine.all().find(w=>w.assetId === assetId); },
  byNetworkAndAsset(networkId, symbol){
    return PersistenceEngine.get().cryptoWallets.find(w=>w.network === networkId && w.symbol === symbol.toUpperCase());
  },
  ensure(assetId, networkId){
    const asset = CRYPTO_ASSETS.find(a=>a.id === assetId);
    if (!asset) return null;
    let w = CryptoWalletEngine.byNetworkAndAsset(networkId, asset.symbol);
    if (w) return w;
    const newWallet = { id: ID.wallet(), assetId: asset.id, symbol: asset.symbol, network: networkId, address: AddressEngine.generate(networkId), balance: 0, availableBalance: 0, lockedBalance: 0, createdAt: Date.now() };
    const s = PersistenceEngine.get();
    s.cryptoWallets.push(newWallet);
    PersistenceEngine.set({ cryptoWallets: s.cryptoWallets });
    return newWallet;
  },
  update(assetId, networkId, patch){
    const s = PersistenceEngine.get();
    const idx = s.cryptoWallets.findIndex(w=>w.assetId === assetId && w.network === networkId);
    if (idx === -1) return null;
    s.cryptoWallets[idx] = { ...s.cryptoWallets[idx], ...patch };
    PersistenceEngine.set({ cryptoWallets: s.cryptoWallets });
    return s.cryptoWallets[idx];
  },
  credit(assetId, networkId, amount){
    const w = CryptoWalletEngine.byNetworkAndAsset(networkId, (CRYPTO_ASSETS.find(a=>a.id === assetId)||{}).symbol);
    if (!w) return null;
    return CryptoWalletEngine.update(assetId, networkId, { balance: w.balance + amount, availableBalance: w.availableBalance + amount });
  },
  debit(assetId, networkId, amount){
    const w = CryptoWalletEngine.byNetworkAndAsset(networkId, (CRYPTO_ASSETS.find(a=>a.id === assetId)||{}).symbol);
    if (!w || w.availableBalance < amount) return null;
    return CryptoWalletEngine.update(assetId, networkId, { balance: w.balance - amount, availableBalance: w.availableBalance - amount });
  }
});

const PortfolioEngine = Object.freeze({
  snapshot(){
    const s = PersistenceEngine.get();
    const rows = s.cryptoWallets.map(w=>{
      const asset = CRYPTO_ASSETS.find(a=>a.id === w.assetId) || { name:w.symbol, symbol:w.symbol };
      const price = CryptoMarketEngine.priceUSD(w.symbol);
      const change = CryptoMarketEngine.change24h(w.symbol);
      return { walletId:w.id, assetId:w.assetId, symbol:w.symbol, name:asset.name, balance:w.balance, available:w.availableBalance, price, fiatValue: w.balance * price, change24h: change, network: w.network };
    });
    const total = rows.reduce((sum, r)=>sum + r.fiatValue, 0);
    const totalChangePct = total > 0 ? rows.reduce((sum, r)=>sum + (r.change24h * r.fiatValue), 0) / total : 0;
    return { rows, totalUSD: total, totalChangePct };
  }
});

    SA:{ len:24, ph:'SA00 0000 0000 0000 0000 0000' },

    BH:{ len:22, ph:'BH00 XXXX 0000 0000 0000 00' },

    FR:{ len:27, ph:'FR00 0000 0000 0000 0000 0000 000' },
    EG:{ len:29, ph:'EG00 0000 0000 0000 0000 0000 0000' },

const ContactsEngine = Object.freeze({
  all(){ return PersistenceEngine.get().favoriteNumbers || []; },
  byNumber(num){
    const digits = String(num||'').replace(/\D/g,'');
    if (!digits || digits.length < 6) return null;
    return ContactsEngine.all().find(c => {
      const cd = String(c.digits || c.number || '').replace(/\D/g,'');
      return cd === digits || (cd.length >= 6 && digits.length >= 6 && (cd.endsWith(digits.slice(-6)) || digits.endsWith(cd.slice(-6))));
    }) || null;
  },
  add({ number, name, fullName, country }){
    const s = PersistenceEngine.get();
    const digits = String(number||'').replace(/\D/g,'');
    if (digits.length < 6) throw new Error('Numéro invalide');
    if (!name || name.length < 2) throw new Error('Nom requis');
    const existing = s.favoriteNumbers.findIndex(c=>c.digits === digits);
    const entry = {
      id: existing >= 0 ? s.favoriteNumbers[existing].id : ID.contact(),
      number, digits, name: name.toUpperCase(),
      fullName: (fullName || name).toUpperCase(),
      country: country || 'OM',
      verified: true, createdAt: Date.now()
    };
    if (existing >= 0) s.favoriteNumbers[existing] = entry; else s.favoriteNumbers.push(entry);
    PersistenceEngine.set({ favoriteNumbers: s.favoriteNumbers });
    return entry;
  },
  remove(id){
    const s = PersistenceEngine.get();
    s.favoriteNumbers = s.favoriteNumbers.filter(c=>c.id !== id);
    PersistenceEngine.set({ favoriteNumbers: s.favoriteNumbers });
  },
  mask(name){
    if (!name) return '—';
    const clean = String(name).toUpperCase().replace(/\s+/g,'');
    if (clean.length <= 6) return clean;
    const head = clean.slice(0,3);
    const tail = clean.slice(-4);
    const hash = '#'.repeat(Math.max(3, clean.length - 7));
    return head + hash + tail;
  }
});

const IdentifierEngine = Object.freeze({
  label(type, lang){
    const map = { PHONE:'identifier.phone', IBAN:'identifier.iban', ACCOUNT_NUMBER:'identifier.account', ROUTING_ACCOUNT:'identifier.routing', MOBILE_MONEY:'identifier.mobile_money', EMAIL:'identifier.email', SERVICE_ID:'identifier.service_id', YOR_ID:'transfer.yor_id_label', WALLET_ADDRESS:'identifier.service_id' };
    return t(map[type] || 'identifier.service_id');
  },
  placeholder(type){
    switch(type){
      case 'PHONE': return '7 79 86 54 44';
      case 'IBAN': return 'AE00 0000 0000 0000 0000 000';
      case 'ACCOUNT_NUMBER': return '0000 0000 0000';
      case 'ROUTING_ACCOUNT': return '021000021 / 1234567890';
      case 'MOBILE_MONEY': return '07 00 00 00 00';
      case 'EMAIL': return 'user@example.com';
      case 'YOR_ID': return 'YOR-XXXXXX';
      case 'SERVICE_ID': return '@username';
      default: return '';
    }
  },
  validate(type, value){
    const v = String(value||'').trim();
    const digits = v.replace(/\D/g,'');
    switch(type){
      case 'PHONE': return digits.length >= 6 && digits.length <= 15 ? {ok:true} : {ok:false, reason:t('errors.INVALID_PHONE')};
      case 'MOBILE_MONEY': return digits.length >= 6 && digits.length <= 15 ? {ok:true} : {ok:false, reason:t('errors.INVALID_PHONE')};
      case 'IBAN': return /^[A-Z]{2}[0-9]{2}[A-Z0-9]{10,30}$/i.test(v.replace(/\s/g,'')) ? {ok:true} : {ok:false, reason:'IBAN invalide'};
      case 'ACCOUNT_NUMBER': return digits.length >= 6 && digits.length <= 20 ? {ok:true} : {ok:false, reason:t('errors.INVALID_ACCOUNT')};
      case 'ROUTING_ACCOUNT': {
        const parts = v.split('/').map(s=>s.trim());
        return parts.length === 2 && /^\d{9}$/.test(parts[0]) && /^\d{6,17}$/.test(parts[1]) ? {ok:true} : {ok:false, reason:'Format invalide'};
      }
      case 'EMAIL': return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? {ok:true} : {ok:false, reason:'Email invalide'};
      case 'YOR_ID': return /^YOR-[A-Z0-9]{6,}$/i.test(v) ? {ok:true} : {ok:false, reason:'YOR ID invalide'};
      case 'SERVICE_ID': return v.length >= 4 ? {ok:true} : {ok:false, reason:'Identifiant invalide'};
      default: return v.length >= 3 ? {ok:true} : {ok:false, reason:'Valeur invalide'};
    }
  },
  mask(type, value){
    const v = String(value||'');
    if (type === 'EMAIL'){
      const [u,d] = v.split('@');
      return u && d ? u.slice(0,2) + '•••@' + d : v;
    }
    if (type === 'IBAN') return v.slice(0,4) + '••••••' + v.slice(-4);
    if (type === 'ROUTING_ACCOUNT'){
      const [r,a] = v.split('/').map(s=>s.trim());
      return (r? '•••'+r.slice(-4):'') + ' / ' + (a? '••••'+a.slice(-4):'');
    }
    if (v.length < 6) return v;
    return v.slice(0,3) + '•••' + v.slice(-3);
  }
});

const CountryTransferEngine = Object.freeze({
  allCountries(){ return Object.values(COUNTRY_TRANSFER_CONFIG); },
  getConfig(iso){ return COUNTRY_TRANSFER_CONFIG[iso] || null; },
  services(iso){
    const c = CountryTransferEngine.getConfig(iso);
    const base = c ? c.services.slice() : [];
    return [INTERNAL_SERVICE_DEF].concat(base);
  },
  getService(iso, serviceId){
    if (serviceId === INTERNAL_SERVICE_DEF.id) return INTERNAL_SERVICE_DEF;
    const c = CountryTransferEngine.getConfig(iso);
    return c ? c.services.find(s => s.id === serviceId) : null;
  },
  recognize({ country, serviceId, identifierType, value }){
    const contact = ContactsEngine.byNumber(value);
    if (contact && (identifierType === 'PHONE' || identifierType === 'MOBILE_MONEY')){
      return { found:true, source:'LINKED_CONTACT', name: contact.fullName, masked: contact.name, phone: contact.number, verified: true };
    }
    const digits = String(value||'').replace(/\D/g,'');
    if (digits.length >= 6){
      const found = PersistenceEngine.get().beneficiaries.find(b=>{
        if (b.country !== country) return false;
        const bd = String(b.phone||'').replace(/\D/g,'');
        return bd && bd.endsWith(digits.slice(-6));
      });
      if (found) return { found:true, source:'BENEFICIARY', name: found.name, masked: ContactsEngine.mask(found.name), phone: found.phone, verified: true };
    }
    return { found:false, source:'NEW' };
  }

    s.networkValidations.forEach(nv=>{ if (nv.status === 'IN_PROGRESS' && now >= nv.endsAt){ nv.status = 'DONE'; changed = true; } });
    s.confirmations.forEach(c=>{ if (c.status === 'IN_PROGRESS' && now >= c.endsAt){ c.status = 'DONE'; changed = true; } });
    NotificationEngine.fireScheduled();
    if (changed) PersistenceEngine.set({ networkValidations: s.networkValidations, confirmations: s.confirmations });
  }
  function start(){ if (timer) return; timer = setInterval(scan, 1000); scan(); }
  function stop(){ if (timer) clearInterval(timer); timer = null; }
  return { start, stop, scan };
})();

const ConfirmationEngine = (() => {
  function startNetworkValidation(ctx){
    const now = Date.now();
    const nv = { id: ID.event(), context: ctx, startedAt: now, endsAt: now + CONFIG.NETWORK_VALIDATION_MS, status: 'IN_PROGRESS' };
    const s = PersistenceEngine.get();
    s.networkValidations.push(nv);
    PersistenceEngine.set({ networkValidations: s.networkValidations });
    return nv;
  }
  function startConfirmation(ctx){
    const now = Date.now();
    const c = { id: ID.event(), context: ctx, startedAt: now, endsAt: now + CONFIG.CONFIRMATION_MS, status: 'IN_PROGRESS' };
    const s = PersistenceEngine.get();
    s.confirmations.push(c);
    PersistenceEngine.set({ confirmations: s.confirmations });
    return c;
  }
  return { startNetworkValidation, startConfirmation };
})();

function applyI18n(){

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (val === '' && (key.indexOf('common.') === 0 || key.indexOf('auth.') === 0 || key.indexOf('field.') === 0)) {
      el.style.display = 'none';
    } else {

function applyTheme(mode){
  let eff = mode === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : mode;
  document.documentElement.setAttribute('data-theme', eff);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', eff === 'dark' ? '#050507' : '#F6F6F9');
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function timeAgo(ts){
  const d = Date.now() - ts;
  if (d < 60000) return LANG === 'en' ? 'Just now' : 'À l\'instant';
  const m = Math.floor(d/60000);
  if (m < 60) return m + ' min';
  const h = Math.floor(m/60);
  if (h < 24) return h + ' h';
  return new Date(ts).toLocaleDateString(LANG === 'en' ? 'en-GB' : 'fr-FR', { day:'2-digit', month:'short' });
}
function fmtDate(ts){ return new Date(ts).toLocaleDateString(LANG === 'en' ? 'en-GB' : LANG === 'ar' ? 'ar-EG' : 'fr-FR', { day:'2-digit', month:'short', year:'numeric' }); }

function toast(msg, type){
  const c = document.getElementById('toasts');
  if (!c) return;
  const existing = c.querySelector('.toast');
  if (existing && existing.textContent === msg) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  c.appendChild(el);
  if ((type === 'success' || type === 'error') && typeof UIKit !== 'undefined') UIKit.haptic(type);
  setTimeout(()=>{ el.style.transition = 'opacity .28s, transform .28s'; el.style.opacity = '0'; el.style.transform = 'translateY(-8px)'; setTimeout(()=>el.remove(), 300); }, 2600);
}
