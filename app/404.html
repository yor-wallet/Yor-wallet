<!doctype html>

<head>

<style>*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px;font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,system-ui,sans-serif;color:#0B1F1D;background:radial-gradient(70% 55% at 50% 40%,#DDF6F2 0%,#FFFFFF 76%)}
html[dir=rtl] body{font-family:"SF Arabic","Geeza Pro","Noto Sans Arabic",system-ui,sans-serif}
main{width:100%;max-width:380px;text-align:center}
.mk{display:block;margin:0 auto 22px;border-radius:24px;filter:drop-shadow(0 16px 26px rgba(11,127,117,.35))}
h1{margin:0 0 8px;font-size:24px;line-height:1.25;font-weight:800}
p{margin:0 0 26px;color:rgba(11,31,29,.66)}
.code{display:inline-block;margin-bottom:14px;padding:4px 12px;border-radius:999px;background:rgba(11,127,117,.1);color:#0B7F75;font-weight:800;font-size:13px;letter-spacing:.08em}
a.b,button{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:16px;background:linear-gradient(180deg,#14B8A6,#0B7F75);color:#fff;font:inherit;font-weight:700;font-size:17px;text-decoration:none;cursor:pointer;box-shadow:0 8px 22px rgba(20,184,166,.32)}
a.b:active,button:active{transform:scale(.98)}
a.s{display:block;margin-top:12px;min-height:44px;line-height:44px;color:#0B7F75;font-weight:700;text-decoration:none}
@media (prefers-color-scheme:dark){body{color:#F2F2F5;background:radial-gradient(70% 55% at 50% 40%,#0E2E2A 0%,#061110 74%)}p{color:rgba(242,242,245,.66)}.code{background:rgba(45,212,191,.14);color:#5EEAD4}a.s{color:#5EEAD4}}
@media (prefers-reduced-motion:no-preference){main{animation:in .5s cubic-bezier(.2,.9,.2,1) both}@keyframes in{from{opacity:0;transform:translateY(14px)}}}</style>
</head>
<body>
<main role="main">
<svg class="mk" viewBox="0 0 512 512" width="88" height="88" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0B7F75"/></linearGradient></defs><rect width="512" height="512" rx="120" fill="url(#g)"/><g transform="translate(-20 -9)" fill="none" stroke="#fff" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"><path d="M180 388V196a54 54 0 0 1 54-54H372"/><path d="M180 266H326"/></g><circle cx="318" cy="369" r="31" fill="#fff"/></svg>
<span class="code">404</span>
<h1 id="t">Page not found</h1>
<p id="p">This page does not exist or has moved. Your account is safe.</p>
<a class="b" id="b" href="/">Back to Friendly Pay</a>
</main>
<script>
var T={
en:{t:'Page not found',p:'This page does not exist or has moved. Your account is safe.',b:'Back to Friendly Pay',s:''},
fr:{t:'Page introuvable',p:'Cette page n\'existe pas ou a été déplacée. Votre compte est en sécurité.',b:'Retour à Friendly Pay',s:''},
ar:{t:'الصفحة غير موجودة',p:'هذه الصفحة غير موجودة أو تم نقلها. حسابك بأمان.',b:'العودة إلى فرندي باي',s:''}};
(function(){var l='en';try{var L=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
 for(var i=0;i<L.length;i++){var c=String(L[i]).toLowerCase().slice(0,2);if(T[c]){l=c;break}}
 var st=localStorage.getItem('yor_device_lang');if(T[st])l=st;}catch(e){}
 var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr';var x=T[l];
 document.title=x.t+' · '+(l==='ar'?'فرندي باي':'Friendly Pay');
 document.getElementById('t').textContent=x.t;document.getElementById('p').textContent=x.p;
 var b=document.getElementById('b');b.textContent=x.b;var s=document.getElementById('s');if(s)s.textContent=x.s;
})();
</script>
</body>
</html>
