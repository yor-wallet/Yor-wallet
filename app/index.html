<script>
/* Desktop Mode (real layout mode): with the stored preference, small screens lay the page out at 1024 CSS px,
   so the existing desktop layout (sidebar, multi-column home) is used. Applied before first paint. */
(function(){try{
  var m=localStorage.getItem('yor_layout_mode');
  if(m==='desktop' && Math.min(screen.width,screen.height)<1024){
    document.querySelector('meta[name="viewport"]').setAttribute('content','width=1024,viewport-fit=cover,minimum-scale=0.2,maximum-scale=5');
    document.documentElement.setAttribute('data-layout','desktop');
  }
}catch(e){}})();
</script>
<script>
/* last theme used on this phone, applied before the first paint (the app confirms it once the account is known) */
(function(){try{var t=localStorage.getItem('fp_theme'),d=document.documentElement;
  if(t==='dark'||(t==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){d.setAttribute('data-theme','dark');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#061110');}
}catch(e){}})();
</script>

<script>
/* YOR responsive engine: computes --ui (global scale) + breakpoint/orientation/aspect flags */
(function(){
  var de=document.documentElement;
  function lerp(x,pts){
    if(x<=pts[0][0])return pts[0][1];
    for(var i=1;i<pts.length;i++){ if(x<=pts[i][0]){var a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);} }
    return pts[pts.length-1][1];
  }
  var MOBILE=[[320,.94],[360,1.02],[390,1.1],[430,1.16],[600,1.26],[768,1.34],[1023,1.42]];
  var DESK=[[1024,1.08],[1280,1.22],[1440,1.32],[1920,1.6],[2560,1.98],[3840,2.7]];
  function apply(){
    var w=window.innerWidth,h=window.innerHeight,asp=w/Math.max(h,1);
    var ew=Math.min(w,h*1.78);                      /* ultra-wide: scale from height */
    var ui;
    if(w<1024){ ui=lerp(w,MOBILE); if(h<480) ui*=.86; }   /* phone landscape */
    else { ui=lerp(Math.max(1024,ew),DESK); }
    de.style.setProperty('--ui',ui.toFixed(3));
    var bp=w<360?'xs':w<480?'sm':w<768?'md':w<1280?'lg':w<1920?'xl':w<2560?'2xl':'ultra';
    de.setAttribute('data-bp',bp);
    de.setAttribute('data-orient',w>h?'landscape':'portrait');
    de.setAttribute('data-aspect',asp>=2.1?'ultrawide':asp>=1.6?'wide':'normal');
    de.setAttribute('data-device',w<768?'phone':w<1024?'tablet':'desktop');
  }
  apply();
  window.addEventListener('resize',apply,{passive:true});
  window.addEventListener('orientationchange',function(){setTimeout(apply,120)},{passive:true});
})();
</script>
